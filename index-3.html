<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spooky House | A Casa do Basquete</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#141414;--panel2:#1c1c1c;--line:#303030;--text:#f5f5f5;--muted:#a6a6a6;--white:#fff;--danger:#ff6464;--ok:#9fe3b0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#f4f4f4;color:#090909;border-radius:10px;padding:10px 14px;font-weight:750}button.secondary{background:#222;color:#fff}button.danger{background:#421c1c;color:#fff;border-color:#713232}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;background:#090909;border:1px solid #3b3b3b;color:#fff;padding:11px;border-radius:9px;min-width:0}textarea{min-height:85px;resize:vertical}label{display:block;color:#d8d8d8;font-size:13px;margin-bottom:5px}.field{margin-bottom:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.muted{color:var(--muted)}.hidden{display:none!important}.wrap{max-width:1200px;margin:auto;padding:18px}.brand{font-weight:950;letter-spacing:2px;font-size:24px}.brand small{display:block;color:#aaa;font-size:11px;letter-spacing:3px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:#171717;border:1px solid var(--line);padding:14px;border-radius:12px}.stat strong{font-size:27px;display:block}.stat span{font-size:12px;color:var(--muted)}h1,h2,h3{line-height:1.2}h1{font-size:27px}h2{font-size:20px;margin-top:0}h3{font-size:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:15px}.nav{display:flex;gap:7px;overflow:auto;padding:12px 0}.nav button{white-space:nowrap;background:#171717;color:#eee}.nav button.active{background:#fff;color:#000}.notice{padding:11px 13px;border-radius:10px;margin:12px 0;background:#222;border:1px solid #444}.notice.error{color:#ffb4b4;border-color:#733}.notice.ok{color:#b6f2c2;border-color:#365c3d}.item{border-bottom:1px solid #303030;padding:12px 0}.item:last-child{border:0}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#292929;font-size:12px;color:#ddd}.pill.ok{color:var(--ok)}.pill.bad{color:#ffaaaa}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #303030;padding:9px 7px;vertical-align:top}th{color:#bbb} .table-wrap{overflow:auto}.auth{max-width:440px;margin:7vh auto}.auth .card{padding:24px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.footer{padding:30px 0;text-align:center;color:#666;font-size:12px}.checkline{display:flex;gap:9px;align-items:center}.checkline input{width:auto}.checkline label{margin:0}.small{font-size:12px}.profile-number{font-size:36px;font-weight:900}
@media(max-width:600px){.wrap{padding:12px}.card{padding:13px}.top .row{width:100%}.nav{margin:0 -2px}.nav button{padding:9px 11px}h1{font-size:23px}}
</style>
</head>
<body>
<div id="authView" class="wrap auth">
  <div class="brand">SPOOKY HOUSE<small>A CASA DO BASQUETE</small></div>
  <div class="card">
    <h1 id="authTitle">Entrar</h1>
    <p class="muted">Plataforma de atletas, treinos e gestão.</p>
    <div id="authMsg" class="notice hidden"></div>
    <form id="loginForm">
      <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required minlength="6"></div>
      <button id="loginBtn" type="submit" style="width:100%">Entrar</button>
    </form>
    <form id="signupForm" class="hidden">
      <div class="field"><label>Nome completo</label><input id="signupName" required></div>
      <div class="field"><label>Telefone (opcional)</label><input id="signupPhone" type="tel"></div>
      <div class="field"><label>E-mail</label><input id="signupEmail" type="email" required></div>
      <div class="field"><label>Senha (mínimo 6 caracteres)</label><input id="signupPassword" type="password" minlength="6" required></div>
      <button type="submit" style="width:100%">Criar conta</button>
    </form>
    <div class="row" style="margin-top:12px">
      <button class="secondary" id="toggleSignup" type="button">Criar conta</button>
      <button class="secondary" id="recoverBtn" type="button">Esqueci a senha</button>
    </div>
    <p class="muted small">O cadastro pode depender da confirmação de e-mail e das regras de perfil configuradas no Supabase.</p>
  </div>
</div>

<div id="appView" class="hidden">
  <div class="wrap">
    <header class="top">
      <div class="brand">SPOOKY HOUSE<small>A CASA DO BASQUETE</small></div>
      <div class="row" style="flex:0 1 auto"><div><strong id="userName">Atleta</strong><div id="userRole" class="muted small">Conta</div></div><button id="logoutBtn" class="secondary">Sair</button></div>
    </header>
    <nav class="nav" id="nav">
      <button data-page="inicio" class="active">Início</button>
      <button data-page="perfil">Meu perfil</button>
      <button data-page="treinos">Treinos</button>
      <button data-page="campeonatos">Campeonatos</button>
      <button data-page="mensalidades">Mensalidades</button>
      <button data-page="presencas">Presenças</button>
      <button data-page="ranking">Ranking</button>
      <button data-page="avisos">Avisos</button>
      <button data-page="admin" id="adminNav" class="hidden">Administração</button>
    </nav>
    <div id="globalMsg" class="notice hidden"></div>
    <main id="content"></main>
    <div class="footer">SPOOKY HOUSE · A CASA DO BASQUETE</div>
  </div>
</div>
<script>
(() => {
'use strict';
// Configure com a URL e a chave publishable/anon do seu projeto Supabase.
const SUPABASE_URL = 'https://mcrreffapstciqpsgvro.supabase.co';
const SUPABASE_KEY = 'sb_publishable_S798hSSxNl63S2sgDYJoog_tl-N6poI';
const db = window.supabase?.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let session = null, user = null, profile = null, page = 'inicio', admin = false;
let cache = {perfis:[], turmas:[], treinos:[], campeonatos:[], mensalidades:[], ranking:[], avisos:[]};
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toLocaleDateString('en-CA');
const money = n => Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dateBR = v => v ? new Date(v+'T12:00:00').toLocaleDateString('pt-BR') : '—';
function msg(text, type='ok', global=true){const el=$(global?'globalMsg':'authMsg');el.textContent=text;el.className='notice '+(type==='error'?'error':'ok');el.classList.remove('hidden');if(global)setTimeout(()=>el.classList.add('hidden'),6500);}
function fail(err, fallback='Não foi possível concluir a operação.'){console.error(err);msg(err?.message||fallback,'error');}
function isAdmin(){return ['admin','administrador'].includes(String(profile?.papel||'').toLowerCase());}
function showAuth(){ $('authView').classList.remove('hidden');$('appView').classList.add('hidden');}
function showApp(){ $('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('userName').textContent=profile?.nome||user?.email||'Conta';$('userRole').textContent=profile?.papel||'Atleta';admin=isAdmin();$('adminNav').classList.toggle('hidden',!admin);go(page);}
async function loadProfile(){
 const {data,error}=await db.from('perfis').select('*').eq('user_id',user.id).maybeSingle();
 if(error) throw error;
 profile=data;
 if(!profile){profile={user_id:user.id,nome:user.email?.split('@')[0]||'Atleta',papel:'atleta'};}
}
async function refreshBase(){
 const jobs=[
  ['turmas',()=>db.from('turmas').select('*').order('nome')],
  ['treinos',()=>db.from('treinos').select('*').order('criado_em',{ascending:false})],
  ['campeonatos',()=>db.from('campeonatos').select('*').order('data_evento',{ascending:true})],
  ['mensalidades',()=>db.from('mensalidades').select('*').order('vencimento',{ascending:false})],
  ['ranking',()=>db.from('ranking_atletas').select('*').order('pontos',{ascending:false})],
  ['avisos',()=>db.from('announcements').select('*').order('created_at',{ascending:false})]
 ];
 for(const [key,fn] of jobs){const {data,error}=await fn();if(error){console.warn(key,error.message);cache[key]=[];}else cache[key]=data||[];}
 const {data,error}=await db.from('perfis').select('*').order('nome');
 if(error)console.warn(error.message);else cache.perfis=data||[];
}
async function go(next){
 page=next;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const c=$('content');c.innerHTML='<div class="card">Carregando…</div>';
 try{
  if(!profile)await loadProfile();
  if(page==='inicio')await renderHome(c);
  else if(page==='perfil')await renderProfile(c);
  else if(page==='treinos')await renderTrainings(c);
  else if(page==='campeonatos')await renderChampionships(c);
  else if(page==='mensalidades')await renderBills(c);
  else if(page==='presencas')await renderAttendance(c);
  else if(page==='ranking')await renderRanking(c);
  else if(page==='avisos')await renderAnnouncements(c);
  else if(page==='admin')await renderAdmin(c);
 }catch(e){c.innerHTML='<div class="card"><h2>Não foi possível carregar esta tela</h2><p class="muted">'+esc(e.message)+'</p><button onclick="location.reload()">Recarregar</button></div>';console.error(e);}
}
function shell(title, subtitle=''){return `<div class="section-head"><div><h1>${esc(title)}</h1>${subtitle?`<p class="muted">${esc(subtitle)}</p>`:''}</div><button class="secondary" onclick="window.SH.refresh()">Atualizar</button></div>`;}
window.SH={refresh:()=>go(page),go};
async function renderHome(c){
 await refreshBase();
 const points=cache.ranking.find(x=>x.atleta_id===user.id)?.pontos||0;
 const bills=cache.mensalidades.filter(x=>x.atleta_id===user.id);
 const openBills=bills.filter(x=>String(x.status).toLowerCase()!=='pago').length;
 c.innerHTML=shell('Painel','Bem-vindo à Spooky House.')+`
 <div class="stats"><div class="stat"><strong>${cache.treinos.filter(x=>x.ativo!==false).length}</strong><span>Treinos ativos</span></div><div class="stat"><strong>${cache.campeonatos.length}</strong><span>Campeonatos</span></div><div class="stat"><strong>${points}</strong><span>Seus pontos</span></div><div class="stat"><strong>${openBills}</strong><span>Mensalidades pendentes</span></div></div>
 <div class="grid"><section class="card"><h2>Próximos treinos</h2>${cache.treinos.filter(x=>x.ativo!==false).slice(0,4).map(t=>`<div class="item"><strong>${esc(t.titulo)}</strong><div class="muted small">${esc(t.dia_semana||'')} ${esc(t.horario_inicio||'')} ${t.local?'· '+esc(t.local):''}</div></div>`).join('')||'<p class="muted">Nenhum treino cadastrado.</p>'}</section><section class="card"><h2>Campeonatos</h2>${cache.campeonatos.slice(0,4).map(x=>`<div class="item"><strong>${esc(x.nome)}</strong><div class="muted small">${dateBR(x.data_evento)} · ${esc(x.local)}</div></div>`).join('')||'<p class="muted">Nenhum campeonato cadastrado.</p>'}</section></div>`;
}
async function renderProfile(c){
 const {data:rank}=await db.from('ranking_atletas').select('pontos').eq('atleta_id',user.id).maybeSingle();
 const {data:publicProfile}=await db.from('perfil_atletas_publico').select('*').eq('atleta_id',user.id).maybeSingle();
 const {data:relations}=await db.from('turma_atletas').select('turma_id').eq('atleta_id',user.id);
 const ids=(relations||[]).map(x=>x.turma_id);
 const teams=cache.turmas.filter(t=>ids.includes(t.id)).map(t=>t.nome).join(', ');
 c.innerHTML=shell('Meu perfil','Seus dados cadastrados.')+`<div class="card"><div class="profile-number">${Number(rank?.pontos??publicProfile?.pontos??0)}</div><div class="muted">Pontos no ranking</div><form id="profileForm" style="margin-top:18px"><div class="grid"><div class="field"><label>Nome</label><input name="nome" value="${esc(profile?.nome)}" required></div><div class="field"><label>E-mail</label><input value="${esc(user.email)}" disabled></div><div class="field"><label>Telefone</label><input name="telefone" value="${esc(profile?.telefone)}"></div><div class="field"><label>Responsável</label><input name="responsavel" value="${esc(profile?.responsavel)}"></div><div class="field"><label>Idade</label><input name="idade" type="number" min="1" max="110" value="${esc(profile?.idade)}"></div><div class="field"><label>Turmas</label><input value="${esc(teams||profile?.turma||'Não vinculada')}" disabled></div></div><button>Salvar perfil</button></form></div>`;
 $('profileForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const patch={nome:f.get('nome').trim(),telefone:f.get('telefone').trim()||null,responsavel:f.get('responsavel').trim()||null,idade:f.get('idade')?Number(f.get('idade')):null};const {error}=await db.from('perfis').update(patch).eq('user_id',user.id);if(error)return fail(error);profile={...profile,...patch};msg('Perfil atualizado.');await renderProfile(c);};
}
function teamName(id){return cache.turmas.find(t=>t.id===id)?.nome||'';}
async function renderTrainings(c){
 await refreshBase();
 c.innerHTML=shell('Treinos','Agenda de treinos da Spooky House.')+(admin?trainingForm():'')+`<div class="grid">${cache.treinos.filter(t=>admin||t.ativo!==false).map(t=>`<article class="card"><span class="pill">${esc(t.modalidade||t.categoria||'Basquete')}</span><h2>${esc(t.titulo)}</h2><p>${esc(t.descricao||'')}</p><div class="muted small">${esc(t.dia_semana||'')} ${esc(t.horario_inicio||'')}${t.horario_fim?'–'+esc(t.horario_fim):''}</div><div class="muted small">${esc(t.local||'')} ${t.turma_id?'· '+esc(teamName(t.turma_id)):''}</div>${admin?`<div class="actions" style="margin-top:10px"><button class="secondary" data-toggle-training="${t.id}" data-active="${t.ativo!==false}">${t.ativo===false?'Ativar':'Desativar'}</button></div>`:''}</article>`).join('')||'<div class="card muted">Nenhum treino cadastrado.</div>'}</div>`;
 if(admin){$('trainingForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const payload={titulo:f.get('titulo'),categoria:f.get('categoria')||'Geral',modalidade:f.get('modalidade')||'Basquete',dia_semana:f.get('dia_semana')||'',horario_inicio:f.get('inicio')||'',horario_fim:f.get('fim')||'',local:f.get('local')||'',descricao:f.get('descricao')||'',ativo:true,criado_por:user.id,turma_id:f.get('turma_id')||null};const {error}=await db.from('treinos').insert(payload);if(error)return fail(error);msg('Treino cadastrado.');await renderTrainings(c);};c.querySelectorAll('[data-toggle-training]').forEach(b=>b.onclick=async()=>{const {error}=await db.from('treinos').update({ativo:b.dataset.active!=='true'}).eq('id',b.dataset.toggleTraining);if(error)return fail(error);await renderTrainings(c);});}
}
function trainingForm(){return `<form id="trainingForm" class="card"><h2>Novo treino</h2><div class="grid"><div class="field"><label>Título</label><input name="titulo" required></div><div class="field"><label>Categoria</label><input name="categoria" placeholder="Sub-17, adulto..."></div><div class="field"><label>Modalidade</label><input name="modalidade" value="Basquete"></div><div class="field"><label>Dia da semana</label><input name="dia_semana" placeholder="Segunda-feira"></div><div class="field"><label>Horário inicial</label><input name="inicio" placeholder="19:00"></div><div class="field"><label>Horário final</label><input name="fim" placeholder="20:30"></div><div class="field"><label>Local</label><input name="local" value="Centro Esportivo João do Pulo"></div><div class="field"><label>Turma</label><select name="turma_id"><option value="">Sem turma específica</option>${cache.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select></div></div><div class="field"><label>Descrição</label><textarea name="descricao"></textarea></div><button>Cadastrar treino</button></form>`;}
async function renderChampionships(c){
 await refreshBase();
 c.innerHTML=shell('Campeonatos','Competições e convocações.')+(admin?`<form id="champForm" class="card"><h2>Novo campeonato</h2><div class="grid"><div class="field"><label>Nome</label><input name="nome" required></div><div class="field"><label>Categoria</label><input name="categoria" required></div><div class="field"><label>Data</label><input name="data" type="date"></div><div class="field"><label>Horário</label><input name="horario" placeholder="09:00" required></div><div class="field"><label>Local</label><input name="local" required></div></div><div class="field"><label>Descrição</label><textarea name="descricao" required></textarea></div><button>Cadastrar campeonato</button></form>`:'')+`<div class="grid">${cache.campeonatos.map(x=>`<article class="card"><span class="pill">${esc(x.categoria)}</span><h2>${esc(x.nome)}</h2><p>${dateBR(x.data_evento)} · ${esc(x.horario)}</p><p>${esc(x.local)}</p><p class="muted">${esc(x.descricao)}</p>${user?`<button class="secondary" data-callup="${x.id}">Ver convocação</button>`:''}${admin?` <button class="danger" data-delete-champ="${x.id}">Excluir</button>`:''}<div id="callup-${x.id}" class="small muted"></div></article>`).join('')||'<div class="card muted">Nenhum campeonato cadastrado.</div>'}</div>`;
 if(admin){$('champForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from('campeonatos').insert({nome:f.get('nome'),categoria:f.get('categoria'),data_evento:f.get('data')||null,horario:f.get('horario'),local:f.get('local'),descricao:f.get('descricao'),criado_por:user.id});if(error)return fail(error);msg('Campeonato cadastrado.');await renderChampionships(c);};c.querySelectorAll('[data-delete-champ]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir este campeonato?'))return;const {error}=await db.from('campeonatos').delete().eq('id',b.dataset.deleteChamp);if(error)return fail(error);await renderChampionships(c);});}
 c.querySelectorAll('[data-callup]').forEach(b=>b.onclick=async()=>{const id=b.dataset.callup;const box=$('callup-'+id);const {data,error}=await db.from('convocacoes').select('atleta_id').eq('campeonato_id',id);if(error){box.textContent=error.message;return;}const ids=(data||[]).map(x=>x.atleta_id);box.textContent=ids.includes(user.id)?'Você está convocado!':`Convocações registradas: ${ids.length}.`;});
}
async function renderBills(c){
 await refreshBase();
 const own=cache.mensalidades.filter(x=>admin||x.atleta_id===user.id);
 c.innerHTML=shell('Mensalidades','Controle de pagamentos. Não processa pagamentos online.')+(admin?`<form id="billForm" class="card"><h2>Lançar mensalidade</h2><div class="grid"><div class="field"><label>Atleta</label><select name="atleta_id" required><option value="">Selecione</option>${cache.perfis.filter(p=>p.papel!=='admin').map(p=>`<option value="${p.user_id}">${esc(p.nome)}</option>`).join('')}</select></div><div class="field"><label>Valor (R$)</label><input name="valor" type="number" min="0" step=".01" required></div><div class="field"><label>Vencimento</label><input name="vencimento" type="date" required></div><div class="field"><label>Descrição</label><input name="descricao" placeholder="Mensalidade de outubro"></div></div><button>Lançar cobrança</button></form>`:'')+`<div class="card"><div class="table-wrap"><table><thead><tr><th>Descrição</th>${admin?'<th>Atleta</th>':''}<th>Valor</th><th>Vencimento</th><th>Status</th>${admin?'<th>Ações</th>':''}</tr></thead><tbody>${own.map(b=>`<tr><td>${esc(b.descricao||'Mensalidade')}</td>${admin?`<td>${esc(cache.perfis.find(p=>p.user_id===b.atleta_id)?.nome||b.atleta_id)}</td>`:''}<td>${money(b.valor)}</td><td>${dateBR(b.vencimento)}</td><td><span class="pill ${b.status==='pago'?'ok':'bad'}">${esc(b.status)}</span></td>${admin?`<td><div class="actions"><button data-bill-status="${b.id}" data-status="${b.status==='pago'?'pendente':'pago'}">${b.status==='pago'?'Marcar pendente':'Marcar pago'}</button><button class="danger" data-bill-delete="${b.id}">Excluir</button></div></td>`:''}</tr>`).join('')||`<tr><td colspan="${admin?6:4}">Nenhuma mensalidade encontrada.</td></tr>`}</tbody></table></div></div>`;
 if(admin){$('billForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from('mensalidades').insert({atleta_id:f.get('atleta_id'),valor:Number(f.get('valor')),vencimento:f.get('vencimento'),descricao:f.get('descricao')||null,status:'pendente',criado_por:user.id});if(error)return fail(error);msg('Mensalidade lançada.');await renderBills(c);};c.querySelectorAll('[data-bill-status]').forEach(b=>b.onclick=async()=>{const patch={status:b.dataset.status,pago_em:b.dataset.status==='pago'?new Date().toISOString():null};const {error}=await db.from('mensalidades').update(patch).eq('id',b.dataset.billStatus);if(error)return fail(error);await renderBills(c);});c.querySelectorAll('[data-bill-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir mensalidade?'))return;const {error}=await db.from('mensalidades').delete().eq('id',b.dataset.billDelete);if(error)return fail(error);await renderBills(c);});}
}
async function renderRanking(c){
 await refreshBase();
 const profiles=cache.perfis.filter(p=>p.papel!=='admin');
 const scores=cache.ranking.slice().sort((a,b)=>b.pontos-a.pontos);
 c.innerHTML=shell('Ranking','Pontuação dos atletas.')+`<div class="card"><div class="table-wrap"><table><thead><tr><th>#</th><th>Atleta</th><th>Pontos</th></tr></thead><tbody>${scores.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(profiles.find(p=>p.user_id===r.atleta_id)?.nome||r.atleta_id)}</td><td><strong>${r.pontos}</strong></td></tr>`).join('')||'<tr><td colspan="3">Ranking ainda sem pontuação.</td></tr>'}</tbody></table></div></div>`+(admin?`<form id="pointsForm" class="card"><h2>Movimentar ranking</h2><div class="grid"><div class="field"><label>Atleta</label><select name="atleta_id" required><option value="">Selecione</option>${profiles.map(p=>`<option value="${p.user_id}">${esc(p.nome)}</option>`).join('')}</select></div><div class="field"><label>Tipo</label><select name="tipo"><option value="bonus">Bônus</option><option value="penalidade">Penalidade</option><option value="ajuste">Ajuste manual</option></select></div><div class="field"><label>Pontos (+ ou -)</label><input name="pontos" type="number" required></div></div><div class="field"><label>Descrição</label><input name="descricao" required></div><button>Registrar movimentação</button></form>`:'');
 if(admin)$('pointsForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {data,error}=await db.rpc('registrar_pontos_ranking',{p_atleta_id:f.get('atleta_id'),p_tipo:f.get('tipo'),p_pontos:Number(f.get('pontos')),p_descricao:f.get('descricao')});if(error)return fail(error);msg('Pontuação registrada.');await renderRanking(c);};
}
async function renderAttendance(c){
 await refreshBase();
 const {data:rels,error:relErr}=await db.from('turma_atletas').select('turma_id').eq('atleta_id',user.id);
 const teamIds=(rels||[]).map(x=>x.turma_id);
 const teamOptions=cache.turmas.filter(t=>admin||teamIds.includes(t.id));
 c.innerHTML=shell('Presenças','Consulte o histórico ou registre a chamada.')+(admin?`<div class="card"><h2>Registrar chamada</h2><form id="attendanceForm"><div class="grid"><div class="field"><label>Turma</label><select name="turma_id" required><option value="">Selecione</option>${cache.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input name="data" type="date" value="${today()}" required></div></div><button>Carregar chamada</button></form><div id="roster"></div></div>`:'')+`<div class="card"><h2>Meu histórico</h2><div id="myAttendance">Carregando histórico…</div></div>`;
 if(admin)$('attendanceForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const turmaId=f.get('turma_id'),date=f.get('data');const {data:existing,error}=await db.from('chamadas').select('*').eq('turma_id',turmaId).eq('data_chamada',date).maybeSingle();if(error)return fail(error);let call=existing;if(!call){const {data:created,error:createErr}=await db.rpc('criar_chamada_com_atletas',{p_turma_id:turmaId,p_data:date});if(createErr)return fail(createErr);call=Array.isArray(created)?created[0]:created;if(!call?.id){const {data:again,error:againErr}=await db.from('chamadas').select('*').eq('turma_id',turmaId).eq('data_chamada',date).maybeSingle();if(againErr||!again)return fail(againErr||new Error('A função não retornou a chamada.'));call=again;}}await showRoster(call,turmaId);};
 async function showRoster(call,teamId){const box=$('roster');box.innerHTML='<p class="muted">Carregando atletas…</p>';const {data:members,error}=await db.from('turma_atletas').select('atleta_id').eq('turma_id',teamId);if(error){box.textContent=error.message;return;}const ids=(members||[]).map(x=>x.atleta_id);const people=cache.perfis.filter(p=>ids.includes(p.user_id));const {data:pres,error:presErr}=await db.from('chamada_presencas').select('*').eq('chamada_id',call.id);if(presErr){box.textContent=presErr.message;return;}box.innerHTML=`<h3>${esc(teamName(teamId))} · ${dateBR(call.data_chamada)}</h3><div id="rosterRows">${people.map(p=>{const saved=pres.find(x=>x.atleta_id===p.user_id);return `<div class="item checkline"><input type="checkbox" data-athlete="${p.user_id}" ${saved?.presente?'checked':''}><label>${esc(p.nome)}</label></div>`}).join('')||'<p>Nenhum atleta vinculado a esta turma.</p>'}</div><div class="actions" style="margin-top:12px"><button id="markAll">Marcar todos</button><button id="saveRoster">Salvar chamada</button></div>`;$('markAll').onclick=()=>box.querySelectorAll('[data-athlete]').forEach(x=>x.checked=true);$('saveRoster').onclick=async()=>{const rows=[...box.querySelectorAll('[data-athlete]')].map(x=>({chamada_id:call.id,atleta_id:x.dataset.athlete,presente:x.checked,marcado_por:user.id,atualizado_em:new Date().toISOString()}));if(!rows.length){msg('Não há atletas para salvar.');return;}const {error}=await db.from('chamada_presencas').upsert(rows,{onConflict:'chamada_id,atleta_id'});if(error)return fail(error);msg('Chamada salva.');};}
 async function loadHistory(){const box=$('myAttendance');const {data:pres,error}=await db.from('chamada_presencas').select('chamada_id,presente').eq('atleta_id',user.id);if(error){box.textContent=error.message;return;}const ids=[...new Set((pres||[]).map(x=>x.chamada_id))];if(!ids.length){box.innerHTML='<p class="muted">Nenhuma presença registrada ainda.</p>';return;}const {data:calls,error:callErr}=await db.from('chamadas').select('*').in('id',ids).order('data_chamada',{ascending:false});if(callErr){box.textContent=callErr.message;return;}const present=(pres||[]).filter(x=>x.presente).length;box.innerHTML=`<div class="stats"><div class="stat"><strong>${pres.length}</strong><span>Registros</span></div><div class="stat"><strong>${present}</strong><span>Presenças</span></div><div class="stat"><strong>${Math.round(present/pres.length*100)}%</strong><span>Frequência</span></div></div>${calls.map(call=>{const p=pres.find(x=>x.chamada_id===call.id);return `<div class="item"><strong>${dateBR(call.data_chamada)}</strong><span class="pill ${p?.presente?'ok':'bad'}">${p?.presente?'Presente':'Ausente'}</span><div class="muted small">${esc(teamName(call.turma_id))}</div></div>`}).join('')}`;}
 await loadHistory();
}
async function renderAnnouncements(c){
 await refreshBase();
 const items=cache.avisos.filter(a=>a.target_type==='all'||(a.target_type==='athlete'&&a.target_athlete_id===user.id)||(a.target_type==='class'&&cache.turmas.some(t=>t.id===a.target_class_id)));
 c.innerHTML=shell('Avisos','Comunicados da equipe.')+(admin?`<form id="noticeForm" class="card"><h2>Novo aviso</h2><div class="field"><label>Título</label><input name="title" required></div><div class="field"><label>Mensagem</label><textarea name="message" required></textarea></div><div class="grid"><div class="field"><label>Destinatários</label><select name="target_type"><option value="all">Todos</option><option value="class">Turma</option><option value="athlete">Atleta</option></select></div><div class="field"><label>ID da turma (se necessário)</label><input name="target_class_id" type="number"></div><div class="field"><label>ID do atleta (UUID, se necessário)</label><input name="target_athlete_id"></div></div><button>Publicar aviso</button></form>`:'')+`<div class="grid">${items.map(a=>`<article class="card"><h2>${esc(a.title)}</h2><p>${esc(a.message)}</p><div class="muted small">${a.created_at?new Date(a.created_at).toLocaleString('pt-BR'):''}</div></article>`).join('')||'<div class="card muted">Nenhum aviso disponível.</div>'}</div>`;
 if(admin)$('noticeForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const payload={title:f.get('title'),message:f.get('message'),target_type:f.get('target_type'),target_class_id:f.get('target_class_id')?Number(f.get('target_class_id')):null,target_athlete_id:f.get('target_athlete_id')||null};const {error}=await db.from('announcements').insert(payload);if(error)return fail(error);msg('Aviso publicado.');await renderAnnouncements(c);};
}
async function renderAdmin(c){
 if(!admin){c.innerHTML='<div class="card">Acesso restrito à administração.</div>';return;}
 await refreshBase();
 c.innerHTML=shell('Administração','Gestão da equipe.')+`<div class="grid"><div class="stat"><strong>${cache.perfis.length}</strong><span>Perfis cadastrados</span></div><div class="stat"><strong>${cache.turmas.length}</strong><span>Turmas</span></div><div class="stat"><strong>${cache.treinos.length}</strong><span>Treinos</span></div><div class="stat"><strong>${cache.mensalidades.filter(x=>x.status!=='pago').length}</strong><span>Mensalidades pendentes</span></div></div><div class="card"><h2>Atletas e vínculos com turmas</h2><div class="table-wrap"><table><thead><tr><th>Atleta</th><th>Papel</th><th>Telefone</th><th>Turma atual (texto)</th></tr></thead><tbody>${cache.perfis.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(p.papel)}</td><td>${esc(p.telefone||'—')}</td><td>${esc(p.turma||'—')}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Criar turma</h2><form id="teamForm"><div class="grid"><div class="field"><label>Nome</label><input name="nome" required></div><div class="field"><label>Categoria</label><input name="categoria" required></div><div class="field"><label>Descrição</label><input name="descricao"></div></div><button>Criar turma</button></form></div><div class="card"><h2>Vincular atleta a turma</h2><form id="linkForm"><div class="grid"><div class="field"><label>Atleta</label><select name="atleta_id" required><option value="">Selecione</option>${cache.perfis.filter(p=>p.papel!=='admin').map(p=>`<option value="${p.user_id}">${esc(p.nome)}</option>`).join('')}</select></div><div class="field"><label>Turma</label><select name="turma_id" required><option value="">Selecione</option>${cache.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select></div></div><button>Vincular</button></form></div>`;
 $('teamForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from('turmas').insert({nome:f.get('nome'),categoria:f.get('categoria'),descricao:f.get('descricao')||null,ativo:true,criado_por:user.id});if(error)return fail(error);msg('Turma criada.');await renderAdmin(c);};
 $('linkForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from('turma_atletas').upsert({atleta_id:f.get('atleta_id'),turma_id:f.get('turma_id')},{onConflict:'turma_id,atleta_id'});if(error)return fail(error);msg('Atleta vinculado à turma.');};
}
async function handleLogin(e){e.preventDefault();if(!db)return msg('Cliente Supabase não carregou. Confira a conexão.','error',false);const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message,'error',false);session=data.session;user=data.user;try{await loadProfile();await refreshBase();showApp();}catch(err){fail(err);}}
$('loginForm').addEventListener('submit',handleLogin);
$('toggleSignup').onclick=()=>{const signup=$('signupForm').classList.toggle('hidden');$('loginForm').classList.toggle('hidden',signup);$('authTitle').textContent=signup?'Criar conta':'Entrar';$('toggleSignup').textContent=signup?'Voltar para entrar':'Criar conta';$('recoverBtn').classList.toggle('hidden',signup);};
$('signupForm').onsubmit=async e=>{e.preventDefault();const {data,error}=await db.auth.signUp({email:$('signupEmail').value.trim(),password:$('signupPassword').value,options:{data:{nome:$('signupName').value.trim(),telefone:$('signupPhone').value.trim()}}});if(error)return msg(error.message,'error',false);if(data.user&&data.session){user=data.user;session=data.session;const {error:profileErr}=await db.from('perfis').upsert({user_id:user.id,nome:$('signupName').value.trim(),telefone:$('signupPhone').value.trim()||null,papel:'atleta'},{onConflict:'user_id'});if(profileErr)console.warn('Perfil pode depender do trigger do banco:',profileErr.message);await loadProfile();await refreshBase();showApp();}else msg('Cadastro iniciado. Confira seu e-mail para confirmar a conta.','ok',false);};
$('recoverBtn').onclick=async()=>{const email=$('email').value.trim();if(!email)return msg('Digite seu e-mail no campo acima.','error',false);const {error}=await db.auth.resetPasswordForEmail(email);if(error)return msg(error.message,'error',false);msg('Se o e-mail estiver cadastrado, você receberá as instruções.','ok',false);};
$('logoutBtn').onclick=async()=>{await db.auth.signOut();session=null;user=null;profile=null;showAuth();};
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){if(b.dataset.page==='admin'&&!admin)return;go(b.dataset.page);}});
async function start(){if(!db){msg('Não foi possível iniciar o cliente Supabase.','error',false);return;}const {data:{session:s}}=await db.auth.getSession();if(s){session=s;user=s.user;try{await loadProfile();await refreshBase();showApp();}catch(e){fail(e);showAuth();}}else showAuth();db.auth.onAuthStateChange(async(_event,s)=>{if(s&&!user){session=s;user=s.user;try{await loadProfile();await refreshBase();showApp();}catch(e){console.error(e);}}else if(!s){session=null;user=null;profile=null;showAuth();}});}
start();
})();
</script>
</body>
</html>
