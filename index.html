
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>Spooky House — A Casa do Basquete</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#080808;--panel:#131313;--panel2:#1b1b1b;--line:#303030;--text:#f5f5f5;--muted:#aaa;--green:#b8f4c6;--red:#ffaaaa}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit}button{border:1px solid #eee;background:#f5f5f5;color:#090909;padding:10px 14px;border-radius:9px;font-weight:750;cursor:pointer}button:hover{opacity:.88}button.secondary{background:#242424;color:#fff;border-color:#454545}button.danger{background:#4a1b1b;color:white;border-color:#763838}button:disabled{opacity:.5;cursor:wait}
    input,select,textarea{width:100%;padding:11px;background:#080808;color:#fff;border:1px solid #3a3a3a;border-radius:8px}textarea{min-height:85px;resize:vertical}label{display:block;font-size:13px;color:#d6d6d6;margin:0 0 5px}.field{margin-bottom:12px}
    .hidden{display:none!important}.wrap{max-width:1200px;margin:auto;padding:18px}.auth{max-width:440px;margin:7vh auto}.brand{font-size:25px;font-weight:950;letter-spacing:2px}.brand small{display:block;font-size:10px;color:#aaa;letter-spacing:3px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;margin:12px 0}.auth .card{padding:24px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}.nav{display:flex;gap:7px;overflow:auto;padding:13px 0}.nav button{white-space:nowrap;background:#171717;color:#eee;border-color:#333}.nav button.active{background:#fff;color:#000}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.section-head h1{margin:0;font-size:27px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:#171717;border:1px solid var(--line);padding:14px;border-radius:12px}.stat strong{font-size:27px;display:block}.stat span{font-size:12px;color:var(--muted)}.notice{padding:11px 13px;border-radius:9px;background:#222;border:1px solid #444;margin:12px 0}.notice.error{border-color:#773535;color:var(--red)}.notice.ok{border-color:#365c3d;color:var(--green)}.item{padding:11px 0;border-bottom:1px solid #303030}.item:last-child{border:0}.pill{display:inline-block;border-radius:99px;padding:3px 8px;background:#292929;font-size:12px}.pill.ok{color:var(--green)}.pill.bad{color:var(--red)}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{font-size:12px;padding:7px 9px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px 7px;border-bottom:1px solid #303030;vertical-align:top}th{color:#bbb}.checkline{display:flex;gap:10px;align-items:center}.checkline input{width:auto}.checkline label{margin:0}.footer{text-align:center;padding:28px 0;color:#666;font-size:12px}.profile-number{font-size:38px;font-weight:950}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.empty{padding:15px;color:#aaa}.inline{display:inline-block}
    @media(max-width:620px){.wrap{padding:12px}.card{padding:13px}.auth .card{padding:18px}.section-head h1{font-size:23px}.split{grid-template-columns:1fr}.nav{margin:0 -2px}.nav button{padding:9px 11px}}
  </style>
</head>
<body>
  <section id="authView" class="wrap auth">
    <div class="brand">SPOOKY HOUSE<small>A CASA DO BASQUETE</small></div>
    <div class="card">
      <h1 id="authTitle">Entrar</h1>
      <p class="muted">Treinos, atletas, presença e gestão em um só lugar.</p>
      <div id="authMsg" class="notice hidden"></div>
      <form id="loginForm">
        <div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" autocomplete="email" required></div>
        <div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
        <button id="loginButton" type="submit" style="width:100%">Entrar</button>
      </form>
      <form id="signupForm" class="hidden">
        <div class="field"><label for="signupName">Nome completo</label><input id="signupName" required></div>
        <div class="field"><label for="signupPhone">Telefone</label><input id="signupPhone" type="tel"></div>
        <div class="field"><label for="signupEmail">E-mail</label><input id="signupEmail" type="email" required></div>
        <div class="field"><label for="signupPassword">Senha (mínimo 6 caracteres)</label><input id="signupPassword" type="password" minlength="6" required></div>
        <button type="submit" style="width:100%">Criar conta</button>
      </form>
      <div class="row" style="margin-top:12px">
        <button class="secondary" id="toggleSignup" type="button">Criar conta</button>
        <button class="secondary" id="recoverButton" type="button">Esqueci a senha</button>
      </div>
      <p class="muted small">O cadastro e o acesso aos dados dependem das configurações de autenticação e das políticas do Supabase.</p>
    </div>
  </section>

  <section id="appView" class="hidden">
    <div class="wrap">
      <header class="top">
        <div class="brand">SPOOKY HOUSE<small>A CASA DO BASQUETE</small></div>
        <div class="row" style="flex:0 1 auto"><div><strong id="headerName">Usuário</strong><div class="muted small" id="headerRole">Atleta</div></div><button class="secondary" id="logoutButton">Sair</button></div>
      </header>
      <nav id="nav" class="nav">
        <button data-page="inicio" class="active">Início</button>
        <button data-page="perfil">Meu perfil</button>
        <button data-page="treinos">Treinos</button>
        <button data-page="campeonatos">Campeonatos</button>
        <button data-page="mensalidades">Mensalidades</button>
        <button data-page="presencas">Presenças</button>
        <button data-page="ranking">Ranking</button>
        <button data-page="avisos">Avisos</button>
        <button data-page="admin" id="adminNav" class="hidden">Administração</button>
      </nav>
      <div id="globalMsg" class="notice hidden"></div>
      <main id="content"><div class="card">Carregando...</div></main>
      <div class="footer">SPOOKY HOUSE · A CASA DO BASQUETE</div>
    </div>
  </section>

<script>
(() => {
  'use strict';

  const SUPABASE_URL = 'https://mcrreffapstciqpsgvro.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_S798hSSxNl63S2sgDYJoog_tl-N6poI';
  const db = window.supabase?.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);

  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));

  const today = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };

  const dateBR = value => value
    ? new Date(value + 'T12:00:00').toLocaleDateString('pt-BR')
    : '—';

  const money = value => Number(value || 0).toLocaleString('pt-BR', {
    style: 'currency',
    currency: 'BRL'
  });

  let user = null;
  let session = null;
  let profile = null;
  let isAdmin = false;
  let currentPage = 'inicio';

  let dataCache = {
    perfis: [],
    turmas: [],
    treinos: [],
    campeonatos: [],
    mensalidades: [],
    ranking: [],
    avisos: []
  };

  function showMessage(text, type = 'ok', global = true) {
    const el = $(global ? 'globalMsg' : 'authMsg');
    el.textContent = text;
    el.className = 'notice ' + (type === 'error' ? 'error' : 'ok');
    el.classList.remove('hidden');

    if (global) {
      setTimeout(() => el.classList.add('hidden'), 7000);
    }
  }

  function handleError(error, context = 'Erro na operação') {
    console.error(context, error);
    showMessage(
      `${context}: ${error?.message || 'verifique as permissões e a conexão com o Supabase.'}`,
      'error'
    );
  }

  function buttonRefresh() {
    return '<button class="secondary" type="button" id="refreshCurrent">Atualizar</button>';
  }

  function pageHeader(title, description = '') {
    return `<div class="section-head">
      <div>
        <h1>${esc(title)}</h1>
        ${description ? `<p class="muted">${esc(description)}</p>` : ''}
      </div>
      ${buttonRefresh()}
    </div>`;
  }

  function adminCheck() {
    return isAdmin;
  }

  function teamName(id) {
    return dataCache.turmas.find(t => String(t.id) === String(id))?.nome || '';
  }

  function personName(id) {
    return dataCache.perfis.find(p => p.user_id === id)?.nome || id || '—';
  }

  function setAppVisible(visible) {
    $('authView').classList.toggle('hidden', visible);
    $('appView').classList.toggle('hidden', !visible);
  }

  function setPageButtons() {
    document.querySelectorAll('#nav [data-page]').forEach(b => {
      b.classList.toggle('active', b.dataset.page === currentPage);
    });
  }

  async function loadProfile() {
    const { data, error } = await db
      .from('perfis')
      .select('*')
      .eq('user_id', user.id)
      .maybeSingle();

    if (error) throw error;

    if (data) {
      profile = data;
    } else {
      profile = {
        user_id: user.id,
        nome: user.user_metadata?.nome || user.email?.split('@')[0] || 'Atleta',
        papel: 'atleta',
        telefone: user.user_metadata?.telefone || null
      };
    }

    isAdmin = ['admin', 'administrador'].includes(
      String(profile.papel || '').toLowerCase()
    );

    $('headerName').textContent = profile.nome || user.email;
    $('headerRole').textContent = profile.papel || 'Atleta';
    $('adminNav').classList.toggle('hidden', !isAdmin);
  }

  async function loadBase() {
    const queries = [
      ['turmas', () => db.from('turmas').select('*').order('nome')],
      ['treinos', () => db.from('treinos').select('*').order('criado_em', { ascending: false })],
      ['campeonatos', () => db.from('campeonatos').select('*').order('data_evento', { ascending: true })],
      ['mensalidades', () => db.from('mensalidades').select('*').order('vencimento', { ascending: false })],
      ['ranking', () => db.from('ranking_atletas').select('*').order('pontos', { ascending: false })],
      ['avisos', () => db.from('announcements').select('*').order('created_at', { ascending: false })]
    ];

    for (const [key, query] of queries) {
      const { data, error } = await query();

      if (error) {
        console.warn(`Não carregou ${key}:`, error.message);
        dataCache[key] = [];
      } else {
        dataCache[key] = data || [];
      }
    }

    const { data, error } = await db.from('perfis').select('*').order('nome');

    if (error) {
      console.warn('Não carregou perfis:', error.message);
    } else {
      dataCache.perfis = data || [];
    }
  }

  async function openPage(name){
    currentPage=name;
    setPageButtons();
    const c=$('content');
    c.innerHTML='<div class="card">Carregando...</div>';
    try{
      switch(name){
        case 'inicio':await renderHome(c);break;
        case 'perfil':await renderProfile(c);break;
        case 'treinos':await renderTrainings(c);break;
        case 'campeonatos':await renderChampionships(c);break;
        case 'mensalidades':await renderBills(c);break;
        case 'presencas':await renderAttendance(c);break;
        case 'ranking':await renderRanking(c);break;
        case 'avisos':await renderAnnouncements(c);break;
        case 'admin':await renderAdmin(c);break;
        default:await renderHome(c);
      }
      const refresh=$('refreshCurrent');
      if(refresh)refresh.onclick=()=>openPage(currentPage);
    }catch(error){
      console.error(error);
      c.innerHTML=`<div class="card"><h2>Não foi possível abrir esta tela</h2><p class="muted">${esc(error.message)}</p><button onclick="location.reload()">Recarregar página</button></div>`;
    }
  }

  async function startApp(){
    await loadProfile();
    await loadBase();
    setAppVisible(true);
    await openPage(currentPage);
  }

  async function renderHome(c){
    await loadBase();
    const myBills=dataCache.mensalidades.filter(x=>x.atleta_id===user.id);
    const unpaid=myBills.filter(x=>String(x.status).toLowerCase()!=='pago').length;
    const score=dataCache.ranking.find(x=>x.atleta_id===user.id)?.pontos||0;

    c.innerHTML=pageHeader('Painel','Bem-vindo à Spooky House.')+`
      <div class="stats">
        <div class="stat"><strong>${dataCache.treinos.filter(x=>x.ativo!==false).length}</strong><span>Treinos ativos</span></div>
        <div class="stat"><strong>${dataCache.campeonatos.length}</strong><span>Campeonatos</span></div>
        <div class="stat"><strong>${score}</strong><span>Seus pontos</span></div>
        <div class="stat"><strong>${unpaid}</strong><span>Mensalidades pendentes</span></div>
      </div>
      <div class="split">
        <section class="card"><h2>Próximos treinos</h2>${dataCache.treinos.filter(t=>t.ativo!==false).slice(0,5).map(t=>`<div class="item"><strong>${esc(t.titulo)}</strong><div class="muted small">${esc(t.dia_semana||'')} ${esc(t.horario_inicio||'')} ${t.local?'· '+esc(t.local):''}</div></div>`).join('')||'<p class="muted">Nenhum treino cadastrado.</p>'}</section>
        <section class="card"><h2>Campeonatos</h2>${dataCache.campeonatos.slice(0,5).map(x=>`<div class="item"><strong>${esc(x.nome)}</strong><div class="muted small">${dateBR(x.data_evento)} · ${esc(x.local)}</div></div>`).join('')||'<p class="muted">Nenhum campeonato cadastrado.</p>'}</section>
      </div>
      <section class="card"><h2>Comunicados recentes</h2>${dataCache.avisos.slice(0,3).map(a=>`<div class="item"><strong>${esc(a.title)}</strong><p>${esc(a.message)}</p></div>`).join('')||'<p class="muted">Nenhum comunicado publicado.</p>'}</section>`;
  }

  async function renderProfile(c){
    const [{data:rank,error:rankError},{data:pub,error:pubError},{data:rels,error:relError}]=await Promise.all([
      db.from('ranking_atletas').select('pontos').eq('atleta_id',user.id).maybeSingle(),
      db.from('perfil_atletas_publico').select('*').eq('atleta_id',user.id).maybeSingle(),
      db.from('turma_atletas').select('turma_id').eq('atleta_id',user.id)
    ]);

    if(rankError)console.warn(rankError.message);
    if(pubError)console.warn(pubError.message);
    if(relError)console.warn(relError.message);

    const ids=(rels||[]).map(x=>String(x.turma_id));
    const teams=dataCache.turmas.filter(t=>ids.includes(String(t.id))).map(t=>t.nome).join(', ');
    const score=rank?.pontos??pub?.pontos??0;

    c.innerHTML=pageHeader('Meu perfil','Confira e atualize seus dados.')+`
      <section class="card"><div class="profile-number">${Number(score)}</div><div class="muted">Pontos no ranking</div>
        <form id="profileForm" style="margin-top:18px">
          <div class="grid">
            <div class="field"><label>Nome completo</label><input name="nome" value="${esc(profile?.nome)}" required></div>
            <div class="field"><label>E-mail</label><input value="${esc(user.email)}" disabled></div>
            <div class="field"><label>Telefone</label><input name="telefone" value="${esc(profile?.telefone)}"></div>
            <div class="field"><label>Responsável</label><input name="responsavel" value="${esc(profile?.responsavel)}"></div>
            <div class="field"><label>Idade</label><input name="idade" type="number" min="1" max="110" value="${esc(profile?.idade)}"></div>
            <div class="field"><label>Turmas vinculadas</label><input value="${esc(teams||profile?.turma||'Nenhuma turma vinculada')}" disabled></div>
          </div><button type="submit">Salvar perfil</button>
        </form>
      </section>`;

    $('profileForm').onsubmit=async e=>{
      e.preventDefault();
      const f=new FormData(e.target);
      const patch={
        nome:String(f.get('nome')).trim(),
        telefone:String(f.get('telefone')||'').trim()||null,
        responsavel:String(f.get('responsavel')||'').trim()||null,
        idade:f.get('idade')?Number(f.get('idade')):null
      };
      const {error}=await db.from('perfis').update(patch).eq('user_id',user.id);
      if(error)return handleError(error,'Erro ao salvar perfil');
      profile={...profile,...patch};
      showMessage('Perfil atualizado.');
      await renderProfile(c);
    };
  }

  function trainingForm(){
    return `<form id="trainingForm" class="card"><h2>Cadastrar treino</h2><div class="grid">
      <div class="field"><label>Título</label><input name="titulo" required></div>
      <div class="field"><label>Categoria</label><input name="categoria" placeholder="Sub-17, adulto..."></div>
      <div class="field"><label>Modalidade</label><input name="modalidade" value="Basquete"></div>
      <div class="field"><label>Dia da semana</label><input name="dia_semana" placeholder="Sábado"></div>
      <div class="field"><label>Horário inicial</label><input name="inicio" placeholder="09:00"></div>
      <div class="field"><label>Horário final</label><input name="fim" placeholder="10:30"></div>
      <div class="field"><label>Local</label><input name="local" value="Centro Esportivo João do Pulo"></div>
      <div class="field"><label>Turma</label><select name="turma_id"><option value="">Sem turma específica</option>${dataCache.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select></div>
    </div><div class="field"><label>Descrição</label><textarea name="descricao"></textarea></div><button type="submit">Salvar treino</button></form>`;
  }

  async function renderTrainings(c){
    await loadBase();
    c.innerHTML=pageHeader('Treinos','Agenda e informações dos treinos.')+(isAdmin?trainingForm():'')+`<div class="grid">${dataCache.treinos.filter(t=>isAdmin||t.ativo!==false).map(t=>`<article class="card"><span class="pill">${esc(t.modalidade||t.categoria||'Basquete')}</span><h2>${esc(t.titulo)}</h2><p>${esc(t.descricao||'')}</p><div class="muted small">${esc(t.dia_semana||'')} ${esc(t.horario_inicio||'')}${t.horario_fim?'–'+esc(t.horario_fim):''}</div><div class="muted small">${esc(t.local||'')} ${t.turma_id?'· '+esc(teamName(t.turma_id)):''}</div>${isAdmin?`<div class="actions" style="margin-top:12px"><button class="secondary" data-training-toggle="${t.id}" data-active="${t.ativo!==false}">${t.ativo===false?'Ativar':'Desativar'}</button></div>`:''}</article>`).join('')||'<div class="card muted">Nenhum treino cadastrado.</div>'}</div>`;
    if(isAdmin){
      $('trainingForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const payload={titulo:f.get('titulo'),categoria:f.get('categoria')||'Geral',modalidade:f.get('modalidade')||'Basquete',dia_semana:f.get('dia_semana')||'',horario_inicio:f.get('inicio')||'',horario_fim:f.get('fim')||'',local:f.get('local')||'',descricao:f.get('descricao')||'',ativo:true,criado_por:user.id,turma_id:f.get('turma_id')||null};const {error}=await db.from('treinos').insert(payload);if(error)return handleError(error,'Erro ao cadastrar treino');showMessage('Treino cadastrado.');await renderTrainings(c);};
      c.querySelectorAll('[data-training-toggle]').forEach(b=>b.onclick=async()=>{const {error}=await db.from('treinos').update({ativo:b.dataset.active!=='true'}).eq('id',b.dataset.trainingToggle);if(error)return handleError(error,'Erro ao alterar treino');await renderTrainings(c);});
    }
  }

  async function renderChampionships(c){
    await loadBase();
    const form=isAdmin?`<form id="champForm" class="card"><h2>Cadastrar campeonato</h2><div class="grid"><div class="field"><label>Nome</label><input name="nome" required></div><div class="field"><label>Categoria</label><input name="categoria" required></div><div class="field"><label>Data</label><input name="data" type="date"></div><div class="field"><label>Horário</label><input name="horario" placeholder="09:00" required></div><div class="field"><label>Local</label><input name="local" required></div></div><div class="field"><label>Descrição</label><textarea name="descricao"></textarea></div><button>Cadastrar campeonato</button></form>`:'';
    c.innerHTML=pageHeader('Campeonatos','Calendário de competições e convocações.')+form+`<div class="grid">${dataCache.campeonatos.map(x=>`<article class="card"><span class="pill">${esc(x.categoria)}</span><h2>${esc(x.nome)}</h2><p>${dateBR(x.data_evento)} · ${esc(x.horario)}</p><p>${esc(x.local)}</p><p class="muted">${esc(x.descricao)}</p><div class="actions"><button class="secondary" data-callup="${x.id}">Ver convocação</button>${isAdmin?`<button class="danger" data-champ-delete="${x.id}">Excluir</button>`:''}</div><div class="muted small" id="callup-${x.id}"></div></article>`).join('')||'<div class="card muted">Nenhum campeonato cadastrado.</div>'}</div>`;
    if(isAdmin){
      $('champForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from('campeonatos').insert({nome:f.get('nome'),categoria:f.get('categoria'),data_evento:f.get('data')||null,horario:f.get('horario'),local:f.get('local'),descricao:f.get('descricao')||null,criado_por:user.id});if(error)return handleError(error,'Erro ao cadastrar campeonato');showMessage('Campeonato cadastrado.');await renderChampionships(c);};
      c.querySelectorAll('[data-champ-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir este campeonato?'))return;const {error}=await db.from('campeonatos').delete().eq('id',b.dataset.champDelete);if(error)return handleError(error,'Erro ao excluir campeonato');await renderChampionships(c);});
    }
    c.querySelectorAll('[data-callup]').forEach(b=>b.onclick=async()=>{const box=$('callup-'+b.dataset.callup);box.textContent='Consultando convocações...';const {data,error}=await db.from('convocacoes').select('atleta_id').eq('campeonato_id',b.dataset.callup);if(error){box.textContent=error.message;return;}const ids=(data||[]).map(x=>x.atleta_id);box.textContent=ids.includes(user.id)?'Você está convocado!':`Atletas convocados: ${ids.length}.`;});
  }

  async function renderBills(c){
    await loadBase();
    const bills=dataCache.mensalidades.filter(b=>isAdmin||b.atleta_id===user.id);
    const form=isAdmin?`<form id="billForm" class="card"><h2>Lançar mensalidade</h2><div class="grid"><div class="field"><label>Atleta</label><select name="atleta_id" required><option value="">Selecione</option>${dataCache.perfis.filter(p=>!['admin','administrador'].includes(String(p.papel).toLowerCase())).map(p=>`<option value="${p.user_id}">${esc(p.nome)}</option>`).join('')}</select></div><div class="field"><label>Valor (R$)</label><input name="valor" type="number" min="0" step="0.01" required></div><div class="field"><label>Vencimento</label><input name="vencimento" type="date" required></div><div class="field"><label>Descrição</label><input name="descricao" placeholder="Mensalidade de outubro"></div></div><button>Lançar cobrança</button></form>`:'';
    c.innerHTML=pageHeader('Mensalidades','Controle administrativo de pagamentos.')+form+`<div class="card"><div class="table-wrap"><table><thead><tr><th>Descrição</th>${isAdmin?'<th>Atleta</th>':''}<th>Valor</th><th>Vencimento</th><th>Status</th>${isAdmin?'<th>Ações</th>':''}</tr></thead><tbody>${bills.map(b=>`<tr><td>${esc(b.descricao||'Mensalidade')}</td>${isAdmin?`<td>${esc(personName(b.atleta_id))}</td>`:''}<td>${money(b.valor)}</td><td>${dateBR(b.vencimento)}</td><td><span class="pill ${b.status==='pago'?'ok':'bad'}">${esc(b.status)}</span></td>${isAdmin?`<td><div class="actions"><button data-bill-status="${b.id}" data-next="${b.status==='pago'?'pendente':'pago'}">${b.status==='pago'?'Marcar pendente':'Marcar pago'}</button><button class="danger" data-bill-delete="${b.id}">Excluir</button></div></td>`:''}</tr>`).join('')||`<tr><td colspan="${isAdmin?6:4}">Nenhuma mensalidade encontrada.</td></tr>`}</tbody></table></div></div>`;
    if(isAdmin){
      $('billForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from('mensalidades').insert({atleta_id:f.get('atleta_id'),valor:Number(f.get('valor')),vencimento:f.get('vencimento'),descricao:f.get('descricao')||null,status:'pendente',criado_por:user.id});if(error)return handleError(error,'Erro ao lançar mensalidade');showMessage('Mensalidade lançada.');await renderBills(c);};
      c.querySelectorAll('[data-bill-status]').forEach(b=>b.onclick=async()=>{const next=b.dataset.next;const {error}=await db.from('mensalidades').update({status:next,pago_em:next==='pago'?new Date().toISOString():null}).eq('id',b.dataset.billStatus);if(error)return handleError(error,'Erro ao atualizar cobrança');await renderBills(c);});
      c.querySelectorAll('[data-bill-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir esta mensalidade?'))return;const {error}=await db.from('mensalidades').delete().eq('id',b.dataset.billDelete);if(error)return handleError(error,'Erro ao excluir mensalidade');await renderBills(c);});
    }
  }

  async function renderRanking(c){
    await loadBase();
    const profiles=dataCache.perfis.filter(p=>!['admin','administrador'].includes(String(p.papel||'').toLowerCase()));
    const scores=dataCache.ranking.slice().sort((a,b)=>Number(b.pontos||0)-Number(a.pontos||0));
    c.innerHTML=pageHeader('Ranking','Pontuação dos atletas.')+`<div class="card"><div class="table-wrap"><table><thead><tr><th>Posição</th><th>Atleta</th><th>Pontos</th></tr></thead><tbody>${scores.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(personName(r.atleta_id))}</td><td><strong>${Number(r.pontos||0)}</strong></td></tr>`).join('')||'<tr><td colspan="3">O ranking ainda não possui pontuação.</td></tr>'}</tbody></table></div></div>`+(isAdmin?`<form id="pointsForm" class="card"><h2>Registrar movimentação</h2><div class="grid"><div class="field"><label>Atleta</label><select name="atleta_id" required><option value="">Selecione</option>${profiles.map(p=>`<option value="${p.user_id}">${esc(p.nome)}</option>`).join('')}</select></div><div class="field"><label>Tipo</label><select name="tipo" required><option value="inicial">Pontuação inicial</option><option value="manual" selected>Ajuste manual (bônus ou penalidade)</option><option value="campeonato">Pontuação de campeonato</option></select></div><div class="field"><label>Pontos (+ ou -)</label><input name="pontos" type="number" required></div></div><div class="field"><label>Descrição</label><input name="descricao" required></div><button>Registrar pontos</button></form>`:'');
    if(isAdmin)$('pointsForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const args={p_atleta_id:f.get('atleta_id'),p_tipo:f.get('tipo'),p_pontos:Number(f.get('pontos')),p_descricao:f.get('descricao')};const {error}=await db.rpc('registrar_pontos_ranking',args);if(error)return handleError(error,'Erro ao registrar pontos (confira a assinatura da função registrar_pontos_ranking no Supabase)');showMessage('Movimentação registrada.');await renderRanking(c);};
  }

  async function renderAttendance(c){
    await loadBase();
    c.innerHTML=pageHeader('Presenças','Chamada por turma e histórico individual.')+(isAdmin?`<section class="card"><h2>Registrar chamada</h2><form id="attendanceForm"><div class="grid"><div class="field"><label>Turma</label><select name="turma_id" required><option value="">Selecione</option>${dataCache.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select></div><div class="field"><label>Data da chamada</label><input name="data" type="date" value="${today()}" required></div></div><button>Carregar atletas</button></form><div id="roster"></div></section>`:'')+`<section class="card"><h2>Meu histórico</h2><div id="attendanceHistory">Carregando histórico...</div></section>`;
    if(isAdmin)$('attendanceForm').onsubmit=async e=>{
      e.preventDefault();const f=new FormData(e.target);const teamId=f.get('turma_id'),date=f.get('data');
      const {data:existing,error}=await db.from('chamadas').select('*').eq('turma_id',teamId).eq('data_chamada',date).maybeSingle();
      if(error)return handleError(error,'Erro ao consultar chamada');
      let call=existing;
      if(!call){
        const {data:created,error:createError}=await db.from('chamadas').insert({turma_id:teamId,data_chamada:date,criado_por:user.id}).select('*').single();
        if(createError)return handleError(createError,'Erro ao criar chamada');
        call=created;
      }
      await showRoster(call,teamId);
    };
    async function showRoster(call,teamId){
      const box=$('roster');box.innerHTML='<p class="muted">Carregando atletas...</p>';
      const {data:members,error}=await db.from('turma_atletas').select('atleta_id').eq('turma_id',teamId);
      if(error){box.textContent=error.message;return;}
      const ids=(members||[]).map(x=>x.atleta_id);
      const people=dataCache.perfis.filter(p=>ids.includes(p.user_id));
      const {data:pres,error:presError}=await db.from('chamada_presencas').select('*').eq('chamada_id',call.id);
      if(presError){box.textContent=presError.message;return;}
      box.innerHTML=`<h3>${esc(teamName(teamId))} · ${dateBR(call.data_chamada)}</h3><div id="rosterRows">${people.map(p=>{const row=pres.find(x=>x.atleta_id===p.user_id);return `<div class="item checkline"><input type="checkbox" data-athlete="${p.user_id}" ${row?.presente?'checked':''}><label>${esc(p.nome)}</label></div>`}).join('')||'<p class="muted">Nenhum atleta vinculado à turma.</p>'}</div><div class="actions" style="margin-top:12px"><button id="markAll" type="button">Marcar todos presentes</button><button id="saveRoster" type="button">Salvar chamada</button></div>`;
      $('markAll').onclick=()=>box.querySelectorAll('[data-athlete]').forEach(input=>input.checked=true);
      $('saveRoster').onclick=async()=>{const rows=[...box.querySelectorAll('[data-athlete]')].map(input=>({chamada_id:call.id,atleta_id:input.dataset.athlete,presente:input.checked,marcado_por:user.id,atualizado_em:new Date().toISOString()}));if(!rows.length)return showMessage('Nenhum atleta para registrar.','error');const {error}=await db.from('chamada_presencas').upsert(rows,{onConflict:'chamada_id,atleta_id'});if(error)return handleError(error,'Erro ao salvar chamada');showMessage('Chamada salva com sucesso.');await loadAttendanceHistory();};
    }
    async function loadAttendanceHistory(){
      const box=$('attendanceHistory');
      const {data:pres,error}=await db.from('chamada_presencas').select('chamada_id,presente').eq('atleta_id',user.id);

      if(error){box.textContent=error.message;return;}
      if(!pres?.length){
        box.innerHTML='<p class="muted">Nenhuma presença registrada ainda.</p>';
        return;
      }
      const ids=[...new Set(pres.map(x=>x.chamada_id))];
      const {data:calls,error:callError}=await db.from('chamadas').select('*').in('id',ids).order('data_chamada',{ascending:false});
      if(callError){box.textContent=callError.message;return;}
      const attended=pres.filter(x=>x.presente).length;
      box.innerHTML=`<div class="stats"><div class="stat"><strong>${pres.length}</strong><span>Registros</span></div><div class="stat"><strong>${attended}</strong><span>Presenças</span></div><div class="stat"><strong>${Math.round(attended/pres.length*100)}%</strong><span>Frequência</span></div></div>${calls.map(call=>{const row=pres.find(x=>x.chamada_id===call.id);return `<div class="item"><strong>${dateBR(call.data_chamada)}</strong> <span class="pill ${row?.presente?'ok':'bad'}">${row?.presente?'Presente':'Ausente'}</span><div class="muted small">${esc(teamName(call.turma_id))}</div></div>`}).join('')}`;
    }
    await loadAttendanceHistory();
  }

  async function renderAnnouncements(c){
    await loadBase();
    const announcements=dataCache.avisos.filter(a=>a.target_type==='all'||(a.target_type==='athlete'&&a.target_athlete_id===user.id)||(a.target_type==='class'&&dataCache.turmas.some(t=>String(t.id)===String(a.target_class_id))));
    const form=isAdmin?`<form id="announcementForm" class="card"><h2>Publicar aviso</h2><div class="field"><label>Título</label><input name="title" required></div><div class="field"><label>Mensagem</label><textarea name="message" required></textarea></div><div class="grid"><div class="field"><label>Destinatários</label><select name="target_type"><option value="all">Todos</option><option value="class">Turma</option><option value="athlete">Atleta específico</option></select></div><div class="field"><label>ID da turma (opcional)</label><input name="target_class_id" type="number"></div><div class="field"><label>ID do atleta (UUID)</label><input name="target_athlete_id"></div></div><button>Publicar aviso</button></form>`:'';
    c.innerHTML=pageHeader('Avisos','Comunicados e informações da equipe.')+form+`<div class="grid">${announcements.map(a=>`<article class="card"><h2>${esc(a.title)}</h2><p>${esc(a.message)}</p><div class="muted small">${a.created_at?new Date(a.created_at).toLocaleString('pt-BR'):''}</div></article>`).join('')||'<div class="card muted">Nenhum aviso publicado para você.</div>'}</div>`;
    if(isAdmin)$('announcementForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const payload={title:f.get('title'),message:f.get('message'),target_type:f.get('target_type'),target_class_id:f.get('target_class_id')?Number(f.get('target_class_id')):null,target_athlete_id:f.get('target_athlete_id')||null};const {error}=await db.from('announcements').insert(payload);if(error)return handleError(error,'Erro ao publicar aviso');showMessage('Aviso publicado.');await renderAnnouncements(c);};
  }

  async function renderAdmin(c){
    if(!isAdmin){c.innerHTML='<div class="card">Acesso restrito.</div>';return;}
    await loadBase();
    c.innerHTML=pageHeader('Administração','Resumo e gerenciamento de turmas e atletas.')+`
      <div class="stats"><div class="stat"><strong>${dataCache.perfis.length}</strong><span>Perfis</span></div><div class="stat"><strong>${dataCache.turmas.length}</strong><span>Turmas</span></div><div class="stat"><strong>${dataCache.treinos.length}</strong><span>Treinos</span></div><div class="stat"><strong>${dataCache.mensalidades.filter(b=>b.status!=='pago').length}</strong><span>Cobranças pendentes</span></div></div>
      <section class="card"><h2>Atletas cadastrados</h2><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Papel</th><th>Telefone</th><th>Responsável</th><th>Idade</th></tr></thead><tbody>${dataCache.perfis.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(p.papel)}</td><td>${esc(p.telefone||'—')}</td><td>${esc(p.responsavel||'—')}</td><td>${esc(p.idade||'—')}</td></tr>`).join('')||'<tr><td colspan="5">Sem perfis visíveis para sua conta.</td></tr>'}</tbody></table></div></section>
      <section class="card"><h2>Criar turma</h2><form id="teamForm"><div class="grid"><div class="field"><label>Nome da turma</label><input name="nome" required></div><div class="field"><label>Categoria</label><input name="categoria" required placeholder="Sub-17, feminino, adulto..."></div><div class="field"><label>Descrição</label><input name="descricao"></div></div><button>Criar turma</button></form></section>
      <section class="card"><h2>Vincular atleta à turma</h2><form id="linkForm"><div class="grid"><div class="field"><label>Atleta</label><select name="atleta_id" required><option value="">Selecione</option>${dataCache.perfis.filter(p=>!['admin','administrador'].includes(String(p.papel||'').toLowerCase())).map(p=>`<option value="${p.user_id}">${esc(p.nome)}</option>`).join('')}</select></div><div class="field"><label>Turma</label><select name="turma_id" required><option value="">Selecione</option>${dataCache.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select></div></div><button>Vincular atleta</button></form></section>
      <section class="card"><h2>Atletas por turma</h2><div id="teamRosterList">Carregando...</div></section>`;
    $('teamForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from('turmas').insert({nome:f.get('nome'),categoria:f.get('categoria'),descricao:f.get('descricao')||null,ativo:true,criado_por:user.id});if(error)return handleError(error,'Erro ao criar turma');showMessage('Turma criada.');await renderAdmin(c);};
    $('linkForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from('turma_atletas').upsert({atleta_id:f.get('atleta_id'),turma_id:f.get('turma_id')},{onConflict:'turma_id,atleta_id'});if(error)return handleError(error,'Erro ao vincular atleta');showMessage('Atleta vinculado à turma.');await renderAdmin(c);};
    const rosterBox=$('teamRosterList');
    const {data:links,error}=await db.from('turma_atletas').select('turma_id,atleta_id');
    if(error){rosterBox.textContent=error.message;return;}
    rosterBox.innerHTML=dataCache.turmas.map(t=>{const teamLinks=(links||[]).filter(l=>String(l.turma_id)===String(t.id));return `<div class="item"><strong>${esc(t.nome)}</strong><div class="muted small">${teamLinks.map(l=>esc(personName(l.atleta_id))).join(', ')||'Nenhum atleta vinculado'}</div></div>`}).join('')||'<p class="muted">Nenhuma turma cadastrada.</p>';
  }

  $('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();if(!db)return showMessage('Biblioteca Supabase não carregou. Verifique a internet.','error',false);
    $('loginButton').disabled=true;
    const {data,error}=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});
    $('loginButton').disabled=false;
    if(error)return showMessage(error.message,'error',false);
    user=data.user;session=data.session;
    try{await startApp();}catch(err){handleError(err,'Não foi possível carregar seu perfil');}
  });
  $('toggleSignup').onclick=()=>{const show=$('signupForm').classList.toggle('hidden');$('loginForm').classList.toggle('hidden',show);$('authTitle').textContent=show?'Criar conta':'Entrar';$('toggleSignup').textContent=show?'Voltar para entrar':'Criar conta';$('recoverButton').classList.toggle('hidden',show);};
  $('signupForm').addEventListener('submit',async e=>{
    e.preventDefault();const {data,error}=await db.auth.signUp({email:$('signupEmail').value.trim(),password:$('signupPassword').value,options:{data:{nome:$('signupName').value.trim(),telefone:$('signupPhone').value.trim()}}});
    if(error)return showMessage(error.message,'error',false);
    if(data.session&&data.user){
      user=data.user;session=data.session;
      const {error:profileError}=await db.from('perfis').upsert({user_id:user.id,nome:$('signupName').value.trim(),telefone:$('signupPhone').value.trim()||null,papel:'atleta'},{onConflict:'user_id'});
      if(profileError)console.warn('Perfil pode depender de trigger no banco:',profileError.message);
      try{await startApp();}catch(err){handleError(err,'Conta criada, mas não foi possível carregar o perfil');}
    }else showMessage('Cadastro iniciado. Confirme seu e-mail e depois entre na plataforma.','ok',false);
  });
  $('recoverButton').onclick=async()=>{const email=$('loginEmail').value.trim();if(!email)return showMessage('Digite seu e-mail no campo acima.','error',false);const {error}=await db.auth.resetPasswordForEmail(email);if(error)return showMessage(error.message,'error',false);showMessage('Se o e-mail estiver cadastrado, você receberá as instruções.','ok',false);};
  $('logoutButton').onclick=async()=>{await db.auth.signOut();user=null;session=null;profile=null;isAdmin=false;setAppVisible(false);};
  $('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)openPage(b.dataset.page);});

  async function boot(){
    if(!db){showMessage('Não foi possível carregar o cliente Supabase.','error',false);return;}
    const {data,error}=await db.auth.getSession();if(error)console.warn(error.message);
    if(data?.session){session=data.session;user=session.user;try{await startApp();}catch(err){handleError(err,'Erro ao iniciar a sessão');setAppVisible(false);}}
    else setAppVisible(false);
    db.auth.onAuthStateChange(async(_event,newSession)=>{
      if(newSession&&!user){session=newSession;user=newSession.user;try{await startApp();}catch(err){console.error(err);}}
      if(!newSession){session=null;user=null;profile=null;isAdmin=false;setAppVisible(false);}
    });
  }
  boot();
})();
</script>
</body>
</html>
