
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spooky House | A Casa do Basquete</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080808;--card:#141414;--line:#292929;--white:#fff;--muted:#aaa;--accent:#e8e8e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
header{padding:20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;font-size:24px;letter-spacing:2px}
.brand span{display:block;font-size:10px;letter-spacing:4px;color:var(--muted);margin-top:5px}
main{max-width:1100px;margin:auto;padding:22px}
h1{font-size:27px;margin:0 0 8px}
h2{font-size:19px;margin:0 0 15px}
h3{font-size:15px;margin:0 0 12px}
p{line-height:1.5}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
input,select,textarea{width:100%;padding:12px;background:#090909;color:#fff;border:1px solid #383838;border-radius:7px;margin:5px 0 12px}
label{display:block;font-size:12px;color:#ccc}
button,.btn{background:#fff;color:#000;border:0;border-radius:7px;padding:11px 15px;font-weight:700}
button.secondary{background:#222;color:#fff;border:1px solid #444}
button.danger{background:#641f1f;color:#fff}
button.small{font-size:12px;padding:8px 10px;margin:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
nav button{background:#1c1c1c;color:#fff;border:1px solid #333}
nav button.active{background:#fff;color:#000}
.hidden{display:none!important}
.item{padding:13px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.tag{display:inline-block;padding:5px 8px;border-radius:5px;background:#292929;font-size:11px;margin:3px 0}
.tag.paid{background:#173b26;color:#a7f2bc}
.tag.pending{background:#4a3514;color:#ffdc91}
.notice{padding:12px;border-radius:7px;background:#202020;margin:12px 0;white-space:pre-wrap;font-size:13px}
.error{color:#ff8b8b}
.success{color:#a7f2bc}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #333;vertical-align:top}
.tablewrap{overflow-x:auto}
footer{text-align:center;color:#777;padding:30px;font-size:12px}
a{color:#fff}
@media(max-width:600px){main{padding:13px}header{padding:15px}.card{padding:14px}h1{font-size:23px}}
</style>
</head>
<body>
<header>
  <div class="brand">SPOOKY HOUSE<span>A CASA DO BASQUETE</span></div>
  <div id="headerActions" class="actions"></div>
</header>

<main>
  <section id="authSection">
    <div class="card">
      <h1>Bem-vindo à Spooky House</h1>
      <p class="muted">Basquete, evolução e comunidade.</p>
      <nav>
        <button id="loginTab" class="active" onclick="showAuth('login')">Entrar</button>
        <button id="signupTab" onclick="showAuth('signup')">Criar conta</button>
      </nav>
      <form id="loginForm">
        <label>E-mail</label>
        <input id="loginEmail" type="email" autocomplete="email" required>
        <label>Senha</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
      </form>
      <form id="signupForm" class="hidden">
        <label>Nome completo</label>
        <input id="signupName" required maxlength="100">
        <label>Telefone</label>
        <input id="signupPhone" type="tel" placeholder="(11) 99999-9999">
        <label>Nome do responsável (se aplicável)</label>
        <input id="signupResponsible" maxlength="100">
        <label>E-mail</label>
        <input id="signupEmail" type="email" autocomplete="email" required>
        <label>Crie uma senha</label>
        <input id="signupPassword" type="password" minlength="6" autocomplete="new-password" required>
        <button type="submit">Cadastrar atleta</button>
        <p class="muted">Após o cadastro, a administração poderá atribuir sua turma.</p>
      </form>
      <div id="authMessage" class="notice hidden"></div>
    </div>
  </section>

  <section id="appSection" class="hidden">
    <div class="card">
      <h1 id="welcome">Painel</h1>
      <p id="accountInfo" class="muted"></p>
    </div>
    <nav id="mainNav"></nav>
    <div id="pageContent"></div>
  </section>
</main>

<footer>Spooky House · A Casa do Basquete</footer>

<script>
const SUPABASE_URL = "https://mcrreffapstciqpsgvro.supabase.co";
const SUPABASE_KEY = "sb_publishable_S798hSSxNl63S2sgDYJoog_tl-N6poI";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let isAdmin = false;
let currentPage = "inicio";
let athletesCache = [];
let billsCache = [];

const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function money(value) {
  return Number(value || 0).toLocaleString("pt-BR", {
    style:"currency",currency:"BRL"
  });
}

function dateBR(value) {
  if (!value) return "Não informado";
  const parts = String(value).slice(0,10).split("-");
  return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : value;
}

function message(id, text, type="") {
  const el = $(id);
  el.textContent = text;
  el.className = "notice " + type;
  el.classList.remove("hidden");
}

function hideMessage(id) {
  $(id).classList.add("hidden");
}

function showAuth(mode) {
  $("loginForm").classList.toggle("hidden", mode !== "login");
  $("signupForm").classList.toggle("hidden", mode !== "signup");
  $("loginTab").classList.toggle("active", mode === "login");
  $("signupTab").classList.toggle("active", mode === "signup");
  hideMessage("authMessage");
}

function setBusy(button, busy, text="Processando...") {
  if (!button) return;
  if (busy) {
    button.dataset.oldText = button.textContent;
    button.textContent = text;
    button.disabled = true;
  } else {
    button.textContent = button.dataset.oldText || button.textContent;
    button.disabled = false;
  }
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  const button = event.submitter;
  setBusy(button,true);
  hideMessage("authMessage");
  try {
    const {error} = await db.auth.signInWithPassword({
      email:$("loginEmail").value.trim(),
      password:$("loginPassword").value
    });
    if (error) throw error;
    await startApp();
  } catch (error) {
    message("authMessage", error.message || "Não foi possível entrar.", "error");
  } finally {
    setBusy(button,false);
  }
});

$("signupForm").addEventListener("submit", async event => {
  event.preventDefault();
  const button = event.submitter;
  setBusy(button,true);
  hideMessage("authMessage");
  try {
    const name = $("signupName").value.trim();
    const phone = $("signupPhone").value.trim();
    const responsible = $("signupResponsible").value.trim();

    const {data,error} = await db.auth.signUp({
      email:$("signupEmail").value.trim(),
      password:$("signupPassword").value,
      options:{
        data:{nome:name,telefone:phone,responsavel:responsible}
      }
    });

    if (error) throw error;

    if (data.session) {
      message("authMessage","Cadastro realizado! Entrando na sua conta.","success");
      await startApp();
    } else {
      message("authMessage",
        "Cadastro enviado! Confira seu e-mail para confirmar a conta, se solicitado. Depois, entre pelo login.",
        "success");
      showAuth("login");
    }
  } catch (error) {
    message("authMessage", error.message || "Não foi possível cadastrar.", "error");
  } finally {
    setBusy(button,false);
  }
});

async function startApp() {
  const {data:{user},error} = await db.auth.getUser();
  if (error || !user) {
    showLoggedOut();
    return;
  }

  currentUser = user;

  const {data:profile,error:profileError} = await db
    .from("perfis")
    .select("*")
    .eq("user_id",user.id)
    .maybeSingle();

  if (profileError) {
    message("authMessage","Erro ao carregar perfil: "+profileError.message,"error");
    return;
  }

  if (!profile) {
    message("authMessage",
      "Sua conta existe, mas o perfil não foi criado. Verifique o gatilho de cadastro no SQL do Supabase.",
      "error");
    return;
  }

  currentProfile = profile;
  isAdmin = profile.papel === "admin";

  $("authSection").classList.add("hidden");
  $("appSection").classList.remove("hidden");
  $("welcome").textContent = "Olá, " + (profile.nome || user.email || "atleta");
  $("accountInfo").textContent = isAdmin
    ? "Administrador · Acesso completo ao gerenciamento"
    : "Atleta · Spooky House";

  $("headerActions").innerHTML =
    `<button class="secondary" onclick="logout()">Sair</button>`;

  buildNavigation();
  await navigate(isAdmin ? "inicio" : "inicio");
}

function showLoggedOut() {
  currentUser = null;
  currentProfile = null;
  isAdmin = false;
  $("authSection").classList.remove("hidden");
  $("appSection").classList.add("hidden");
  $("headerActions").innerHTML = "";
}

async function logout() {
  const {error} = await db.auth.signOut();
  if (error) alert(error.message);
  else showLoggedOut();
}

function buildNavigation() {
  const pages = [
    ["inicio","Início"],
    ["turma","Minha turma"],
    ["mensalidades","Mensalidades"],
    ["treinos","Treinos"],
    ["campeonatos","Campeonatos"]
  ];
  if (isAdmin) {
    pages.push(
      ["atletas","Atletas"],
      ["adminmensalidades","Gerenciar mensalidades"],
      ["admintreinos","Cadastrar treino"],
      ["admincampeonatos","Cadastrar campeonato"]
    );
  }
  $("mainNav").innerHTML = pages.map(([id,label]) =>
    `<button class="${id===currentPage?"active":""}" onclick="navigate('${id}')">${label}</button>`
  ).join("");
}

async function navigate(page) {
  if (!isAdmin && page.startsWith("admin") || !isAdmin && page==="atletas") {
    page = "inicio";
  }
  currentPage = page;
  buildNavigation();
  const content = $("pageContent");
  content.innerHTML = `<div class="card">Carregando...</div>`;

  try {
    if (page==="inicio") return renderHome();
    if (page==="turma") return renderMyClass();
    if (page==="mensalidades") return renderMyBills();
    if (page==="treinos") return renderTrainings();
    if (page==="campeonatos") return renderChampionships();
    if (page==="atletas") return renderAthletes();
    if (page==="adminmensalidades") return renderAdminBills();
    if (page==="admintreinos") return renderAdminTrainings();
    if (page==="admincampeonatos") return renderAdminChampionships();
  } catch (error) {
    content.innerHTML = `<div class="card error">Erro: ${esc(error.message)}</div>`;
  }
}

function renderHome() {
  $("pageContent").innerHTML = `
    <div class="grid">
      <div class="card">
        <h2>🏀 Spooky House</h2>
        <p>Bem-vindo à Casa do Basquete.</p>
        <p class="muted">Acompanhe seus treinos, sua turma e suas mensalidades por aqui.</p>
        <a href="https://www.instagram.com/spooky4house/" target="_blank" rel="noopener">Instagram oficial</a>
      </div>
      <div class="card">
        <h2>Minha conta</h2>
        <p>${esc(currentProfile.nome || "Atleta")}</p>
        <p class="muted">${esc(currentUser.email || "")}</p>
        <span class="tag">${isAdmin ? "Administrador" : "Atleta"}</span>
      </div>
    </div>`;
}

function renderMyClass() {
  $("pageContent").innerHTML = `
    <div class="card">
      <h2>Minha turma</h2>
      <p>${currentProfile.turma
        ? `<span class="tag">${esc(currentProfile.turma)}</span>`
        : "Você ainda não foi atribuído a uma turma."}</p>
      <p class="muted">A administração é responsável por definir ou alterar sua turma.</p>
    </div>`;
}

async function renderMyBills() {
  const {data,error} = await db.from("mensalidades")
    .select("*").eq("atleta_id",currentUser.id).order("vencimento",{ascending:false});
  if (error) throw error;

  $("pageContent").innerHTML = `
    <div class="card">
      <h2>Minhas mensalidades</h2>
      ${data.length ? data.map(bill => billHTML(bill,false)).join("") :
        `<p class="muted">Nenhuma mensalidade cadastrada.</p>`}
    </div>`;
}

function billHTML(bill,admin) {
  return `<div class="item">
    <div class="actions" style="justify-content:space-between">
      <strong>${money(bill.valor)}</strong>
      <span class="tag ${bill.status==="pago"?"paid":"pending"}">
        ${bill.status==="pago"?"PAGO":"PENDENTE"}
      </span>
    </div>
    <p class="muted">Vencimento: ${dateBR(bill.vencimento)}</p>
    ${bill.descricao ? `<p>${esc(bill.descricao)}</p>`:""}
    ${bill.pago_em ? `<p class="muted">Registrado como pago em ${dateBR(bill.pago_em)}</p>`:""}
    ${admin ? `<div class="actions">
      <button class="small" onclick="toggleBill('${bill.id}','${bill.status}')">
        ${bill.status==="pago"?"Marcar pendente":"Marcar pago"}
      </button>
      <button class="small danger" onclick="deleteBill('${bill.id}')">Excluir</button>
    </div>`:""}
  </div>`;
}

async function renderAthletes() {
  const {data,error} = await db.from("perfis")
    .select("user_id,nome,telefone,responsavel,turma,papel")
    .order("nome");
  if (error) throw error;

  athletesCache = data || [];
  $("pageContent").innerHTML = `
    <div class="card">
      <h2>Atletas cadastrados</h2>
      <p class="muted">Selecione a turma de cada atleta e salve a alteração.</p>
      ${athletesCache.length ? athletesCache.map(a => `
        <div class="item">
          <strong>${esc(a.nome || "Sem nome")}</strong>
          ${a.papel==="admin" ? `<span class="tag">ADMIN</span>`:""}
          <p class="muted">${esc(a.telefone || "Sem telefone")} · ${esc(a.responsavel || "Sem responsável")}</p>
          <label>Turma</label>
          <input id="turma-${a.user_id}" value="${esc(a.turma || "")}" placeholder="Ex.: Academy Masculino">
          <button class="small" onclick="saveClass('${a.user_id}')">Salvar turma</button>
        </div>`).join("") : `<p>Nenhum perfil encontrado.</p>`}
    </div>`;
}

async function saveClass(userId) {
  const turma = $(`turma-${userId}`).value.trim() || null;
  const {error} = await db.from("perfis").update({turma}).eq("user_id",userId);
  if (error) return alert("Não foi possível salvar: "+error.message);
  alert("Turma atualizada!");
  await renderAthletes();
}

async function renderAdminBills() {
  const [athletesResult,billsResult] = await Promise.all([
    db.from("perfis").select("user_id,nome,turma").order("nome"),
    db.from("mensalidades").select("*").order("vencimento",{ascending:false})
  ]);

  if (athletesResult.error) throw athletesResult.error;
  if (billsResult.error) throw billsResult.error;

  athletesCache = athletesResult.data || [];
  billsCache = billsResult.data || [];

  const athleteOptions = athletesCache.map(a =>
    `<option value="${a.user_id}">${esc(a.nome || "Atleta")} ${a.turma?"— "+esc(a.turma):""}</option>`
  ).join("");

  $("pageContent").innerHTML = `
    <div class="card">
      <h2>Cadastrar mensalidade</h2>
      <form id="billForm">
        <label>Atleta</label>
        <select id="billAthlete" required>
          <option value="">Selecione um atleta</option>${athleteOptions}
        </select>
        <label>Valor em reais</label>
        <input id="billValue" type="number" min="0" step="0.01" placeholder="Ex.: 99,00" required>
        <label>Data de vencimento</label>
        <input id="billDue" type="date" required>
        <label>Descrição (opcional)</label>
        <input id="billDescription" maxlength="200" placeholder="Ex.: Mensalidade de outubro">
        <button type="submit">Cadastrar mensalidade</button>
      </form>
      <div id="billMessage" class="notice hidden"></div>
    </div>
    <div class="card">
      <h2>Mensalidades cadastradas</h2>
      ${billsCache.length ? billsCache.map(b => {
        const athlete = athletesCache.find(a => a.user_id===b.atleta_id);
        return `<div class="item">
          <strong>${esc(athlete?.nome || "Atleta")}</strong>
          ${billHTML(b,true)}
        </div>`;
      }).join("") : `<p class="muted">Nenhuma mensalidade cadastrada.</p>`}
    </div>`;

  $("billForm").addEventListener("submit",createBill);
}

async function createBill(event) {
  event.preventDefault();
  const atleta_id = $("billAthlete").value;
  const valor = Number($("billValue").value);
  const vencimento = $("billDue").value;
  const descricao = $("billDescription").value.trim() || null;

  if (!atleta_id || !vencimento || !Number.isFinite(valor) || valor < 0) {
    return message("billMessage","Confira o atleta, o valor e o vencimento.","error");
  }

  const {error} = await db.from("mensalidades").insert({
    atleta_id,valor,vencimento,descricao,
    status:"pendente",criado_por:currentUser.id
  });

  if (error) return message("billMessage","Erro ao cadastrar: "+error.message,"error");
  alert("Mensalidade cadastrada!");
  await renderAdminBills();
}

async function toggleBill(id,status) {
  const nextStatus = status==="pago" ? "pendente" : "pago";
  const update = {
    status:nextStatus,
    pago_em:nextStatus==="pago" ? new Date().toISOString() : null
  };
  const {error} = await db.from("mensalidades").update(update).eq("id",id);
  if (error) return alert("Erro ao atualizar: "+error.message);
  await renderAdminBills();
}

async function deleteBill(id) {
  if (!confirm("Tem certeza de que deseja excluir esta mensalidade?")) return;
  const {error} = await db.from("mensalidades").delete().eq("id",id);
  if (error) return alert("Erro ao excluir: "+error.message);
  await renderAdminBills();
}

async function renderTrainings() {
  const {data,error} = await db.from("treinos")
    .select("*").eq("ativo",true).order("dia_semana");
  if (error) throw error;

  $("pageContent").innerHTML = `
    <div class="card">
      <h2>Treinos</h2>
      ${data.length ? data.map(t => `
        <div class="item">
          <h3>${esc(t.titulo)}</h3>
          <span class="tag">${esc(t.categoria || "Todos")}</span>
          <span class="tag">${esc(t.modalidade || "Treino")}</span>
          <p>${esc(t.dia_semana || "Dia a confirmar")} · ${esc(t.horario_inicio || "Horário a confirmar")}${t.horario_fim?" – "+esc(t.horario_fim):""}</p>
          <p class="muted">${esc(t.local || "Local a confirmar")}</p>
          ${t.descricao?`<p>${esc(t.descricao)}</p>`:""}
        </div>`).join("") : `<p class="muted">Nenhum treino publicado.</p>`}
    </div>`;
}

async function renderChampionships() {
  const {data,error} = await db.from("campeonatos")
    .select("*").order("data_evento",{ascending:true});
  if (error) throw error;

  $("pageContent").innerHTML = `
    <div class="card">
      <h2>Campeonatos</h2>
      ${data.length ? data.map(c => `
        <div class="item">
          <h3>${esc(c.nome)}</h3>
          ${c.categoria?`<span class="tag">${esc(c.categoria)}</span>`:""}
          <p>${dateBR(c.data_evento)} ${c.horario?"· "+esc(c.horario):""}</p>
          <p class="muted">${esc(c.local || "Local a confirmar")}</p>
          ${c.descricao?`<p>${esc(c.descricao)}</p>`:""}
          ${isAdmin?`<button class="small" onclick="manageCallups('${c.id}')">Gerenciar convocações</button>`:""}
        </div>`).join("") : `<p class="muted">Nenhum campeonato publicado.</p>`}
      ${isAdmin?`<div id="callupArea"></div>`:""}
    </div>`;
}

async function manageCallups(championshipId) {
  const [{data:athletes,error:e1},{data:called,error:e2}] = await Promise.all([
    db.from("perfis").select("user_id,nome,turma").order("nome"),
    db.from("convocacoes").select("atleta_id").eq("campeonato_id",championshipId)
  ]);
  if (e1 || e2) return alert((e1 || e2).message);

  const selected = new Set((called || []).map(c => c.atleta_id));
  $("callupArea").innerHTML = `
    <div class="card">
      <h3>Convocar atletas</h3>
      ${(athletes || []).map(a => `
        <label>
          <input type="checkbox" style="width:auto" id="call-${a.user_id}"
            ${selected.has(a.user_id)?"checked":""}>
          ${esc(a.nome || "Atleta")} ${a.turma?"— "+esc(a.turma):""}
        </label>`).join("")}
      <button onclick="saveCallups('${championshipId}')">Salvar convocações</button>
    </div>`;
}

async function saveCallups(championshipId) {
  const selected = athletesCache.length ? athletesCache : await getAthletes();
  const toSave = selected.filter(a => {
    const el = $("call-"+a.user_id);
    return el && el.checked;
  }).map(a => ({campeonato_id:championshipId,atleta_id:a.user_id}));

  const {error:deleteError} = await db.from("convocacoes")
    .delete().eq("campeonato_id",championshipId);
  if (deleteError) return alert(deleteError.message);

  if (toSave.length) {
    const {error} = await db.from("convocacoes").insert(toSave);
    if (error) return alert(error.message);
  }
  alert("Convocações salvas!");
}

async function getAthletes() {
  const {data,error} = await db.from("perfis")
    .select("user_id,nome,turma").order("nome");
  if (error) throw error;
  athletesCache = data || [];
  return athletesCache;
}

async function renderAdminTrainings() {
  const {data,error} = await db.from("treinos").select("*").order("dia_semana");
  if (error) throw error;

  $("pageContent").innerHTML = `
    <div class="card">
      <h2>Cadastrar treino</h2>
      <form id="trainingForm">
        <label>Título do treino</label><input id="trTitle" required>
        <label>Categoria/turma</label><input id="trCategory" placeholder="Ex.: Academy Masculino">
        <label>Modalidade</label>
        <select id="trMode">
          <option>Treino</option><option>Coletivo</option><option>Open</option><option>Academy</option><option>Individual</option>
        </select>
        <label>Dia da semana</label>
        <select id="trDay">
          <option>Segunda-feira</option><option>Terça-feira</option><option>Quarta-feira</option><option>Quinta-feira</option><option>Sexta-feira</option><option>Sábado</option><option>Domingo</option>
        </select>
        <label>Horário de início</label><input id="trStart" placeholder="19:00">
        <label>Horário de término</label><input id="trEnd" placeholder="20:30">
        <label>Local</label><input id="trPlace" value="Centro Esportivo João do Pulo">
        <label>Descrição</label><textarea id="trDesc" rows="3"></textarea>
        <button type="submit">Publicar treino</button>
      </form>
    </div>
    <div class="card">
      <h2>Treinos cadastrados</h2>
      ${data.length?data.map(t=>`
        <div class="item">
          <strong>${esc(t.titulo)}</strong>
          <p class="muted">${esc(t.dia_semana || "")} · ${esc(t.horario_inicio || "")}</p>
          <button class="small secondary" onclick="toggleTraining('${t.id}',${!t.ativo})">${t.ativo?"Desativar":"Ativar"}</button>
          <button class="small danger" onclick="deleteTraining('${t.id}')">Excluir</button>
        </div>`).join(""):"<p class='muted'>Nenhum treino cadastrado.</p>"}
    </div>`;

  $("trainingForm").addEventListener("submit",createTraining);
}

async function createTraining(event) {
  event.preventDefault();
  const row = {
    titulo:$("trTitle").value.trim(),
    categoria:$("trCategory").value.trim() || "Todos",
    modalidade:$("trMode").value,
    dia_semana:$("trDay").value,
    horario_inicio:$("trStart").value.trim(),
    horario_fim:$("trEnd").value.trim(),
    local:$("trPlace").value.trim(),
    descricao:$("trDesc").value.trim(),
    ativo:true,
    criado_por:currentUser.id
  };
  const {error} = await db.from("treinos").insert(row);
  if (error) return alert("Erro ao publicar treino: "+error.message);
  alert("Treino publicado!");
  await renderAdminTrainings();
}

async function toggleTraining(id,ativo) {
  const {error} = await db.from("treinos").update({ativo}).eq("id",id);
  if (error) return alert(error.message);
  await renderAdminTrainings();
}

async function deleteTraining(id) {
  if (!confirm("Excluir este treino?")) return;
  const {error} = await db.from("treinos").delete().eq("id",id);
  if (error) return alert(error.message);
  await renderAdminTrainings();
}

async function renderAdminChampionships() {
  const {data,error} = await db.from("campeonatos").select("*").order("data_evento");
  if (error) throw error;

  $("pageContent").innerHTML = `
    <div class="card">
      <h2>Cadastrar campeonato</h2>
      <form id="champForm">
        <label>Nome do campeonato</label><input id="chName" required>
        <label>Categoria</label><input id="chCategory" placeholder="Ex.: Sub-21">
        <label>Data</label><input id="chDate" type="date">
        <label>Horário</label><input id="chTime" placeholder="09:00">
        <label>Local</label><input id="chPlace">
        <label>Descrição</label><textarea id="chDesc" rows="3"></textarea>
        <button type="submit">Publicar campeonato</button>
      </form>
    </div>
    <div class="card">
      <h2>Campeonatos cadastrados</h2>
      ${data.length?data.map(c=>`
        <div class="item">
          <strong>${esc(c.nome)}</strong>
          <p class="muted">${dateBR(c.data_evento)} · ${esc(c.local || "")}</p>
          <button class="small danger" onclick="deleteChampionship('${c.id}')">Excluir</button>
        </div>`).join(""):"<p class='muted'>Nenhum campeonato cadastrado.</p>"}
    </div>`;

  $("champForm").addEventListener("submit",createChampionship);
}

async function createChampionship(event) {
  event.preventDefault();
  const row = {
    nome:$("chName").value.trim(),
    categoria:$("chCategory").value.trim() || null,
    data_evento:$("chDate").value || null,
    horario:$("chTime").value.trim() || null,
    local:$("chPlace").value.trim() || null,
    descricao:$("chDesc").value.trim() || null,
    criado_por:currentUser.id
  };
  const {error} = await db.from("campeonatos").insert(row);
  if (error) return alert("Erro ao publicar campeonato: "+error.message);
  alert("Campeonato publicado!");
  await renderAdminChampionships();
}

async function deleteChampionship(id) {
  if (!confirm("Excluir este campeonato e suas convocações?")) return;
  const {error} = await db.from("campeonatos").delete().eq("id",id);
  if (error) return alert(error.message);
  await renderAdminChampionships();
}

db.auth.onAuthStateChange((event,session) => {
  if (event==="SIGNED_OUT") showLoggedOut();
});

(async function init() {
  const {data:{session}} = await db.auth.getSession();
  if (session) await startApp();
})();
</script>
</body>
</html>
