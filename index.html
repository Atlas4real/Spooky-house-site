    /* Visual Court Culture aplicado sobre o HTML original; sem substituir suas funções. */
    /* SH — Court Culture: camada visual, sem alterar a lógica do app */
    :root{
      color-scheme:dark;
      --bg:#0a0a0a;--panel:#141414;--panel2:#1e1e1e;--line:#303030;
      --text:#f5f5f5;--muted:#a7a7a7;--green:#b8f4c6;--red:#ffaaaa;
      --surface:#171717;--white:#f5f5f5;
    }
    body{background:radial-gradient(ellipse at 50% -18%,#262626 0%,#101010 35%,var(--bg) 72%);letter-spacing:.01em}
    .wrap{max-width:1240px;padding:24px}
    .brand{font-size:clamp(22px,3vw,29px);letter-spacing:2.8px;line-height:1.05;text-transform:uppercase}
    .brand small{margin-top:7px;font-size:10px;letter-spacing:4px;font-weight:750}
    .top{padding:8px 0 20px;border-bottom:1px solid #383838;position:relative}
    .top:after{display:none!important;content:none!important}
    .top .row{flex:0 1 auto!important}
    .top .row>div{min-width:100px}
    .top #headerName{font-size:14px}
    .top #headerRole{font-size:11px;margin-top:2px}
    .nav{display:none!important;gap:8px;padding:20px 0 15px;scrollbar-width:thin;scrollbar-color:#444 transparent}
    .nav button{border:1px solid #353535;background:#171717;color:#d8d8d8;border-radius:7px;padding:10px 14px;font-size:12px;font-weight:800;letter-spacing:.02em;transition:background .18s,border-color .18s,transform .18s}
    .nav button:hover{opacity:1;background:#292929;border-color:#666;transform:translateY(-1px)}
    .nav button.active{background:#f5f5f5;color:#090909;border-color:#f5f5f5;box-shadow:0 4px 16px #0005}
    .card{background:linear-gradient(145deg,#171717 0%,#111 100%);border:1px solid #303030;border-radius:15px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #0002}
    .card h2{font-size:18px;letter-spacing:-.3px;margin-top:0}
    .section-head{margin:12px 0 18px;padding:0 0 13px;border-bottom:1px solid #292929}
    .section-head h1{font-size:clamp(25px,4vw,34px);letter-spacing:-1.1px;font-weight:900;line-height:1.1}
    .section-head p{margin:8px 0 0;font-size:13px}
    .section-head .secondary{font-size:12px}
    .stats{gap:12px;margin:16px 0}
    .stat{position:relative;overflow:hidden;background:linear-gradient(145deg,#202020,#141414);border:1px solid #353535;border-radius:13px;padding:17px;min-height:94px}
    .stat:after{content:"";position:absolute;right:-22px;top:-24px;width:66px;height:66px;border:1px solid #ffffff0c;border-radius:50%;box-shadow:0 0 0 10px #ffffff04,0 0 0 20px #ffffff03}
    .stat strong{font-size:30px;letter-spacing:-1px;line-height:1.15}
    .stat span{display:block;margin-top:6px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:750}
    button{border-radius:8px;min-height:40px;transition:background .16s,border-color .16s,transform .16s,opacity .16s}
    button:not(:disabled):hover{opacity:1;transform:translateY(-1px)}
    button:not(.secondary):not(.danger){background:#f5f5f5;color:#090909;border-color:#f5f5f5}
    button:not(.secondary):not(.danger):hover{background:#dcdcdc}
    button.secondary{background:#252525;color:#f5f5f5;border-color:#444}
    button.secondary:hover{background:#303030;border-color:#666}
    button.danger{background:#391b1b;border-color:#693737}
    input,select,textarea{background:#0c0c0c;border-color:#383838;border-radius:8px;min-height:42px;transition:border-color .15s,box-shadow .15s}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#bdbdbd;box-shadow:0 0 0 3px #ffffff12}
    input:disabled{color:#999;background:#151515}
    label{font-weight:700;font-size:12px;letter-spacing:.02em}
    .notice{border-radius:10px;padding:12px 14px;background:#222;border-color:#454545;font-size:13px}
    .notice.ok{background:#172019;border-color:#34523a}
    .notice.error{background:#251616;border-color:#663333}
    .pill{border:1px solid #3b3b3b;background:#222;color:#ddd;padding:4px 9px;font-size:11px;font-weight:750}
    .item{padding:13px 0;border-color:#2b2b2b}
    .grid{gap:14px}
    .split{gap:14px}
    .table-wrap{border:1px solid #303030;border-radius:10px}
    table{font-size:12px}
    td,th{padding:11px 9px;border-color:#2e2e2e}
    th{background:#1d1d1d;color:#ddd;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
    .profile-number{font-size:42px;letter-spacing:-1.5px}
    .profile-photo{width:108px;height:108px;border:3px solid #f2f2f2;box-shadow:0 0 0 5px #ffffff0c}
    .athlete-avatar{border-color:#555;background:#242424}
    .footer{margin-top:28px;border-top:1px solid #252525;letter-spacing:2px;font-weight:800;font-size:10px}
    /* Court Culture refined UI */
    .home-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin:18px 0 22px}
    .home-tile{min-height:142px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:15px;padding:20px;border-radius:15px;background:linear-gradient(145deg,#242424,#141414)!important;color:#f6f6f6!important;border:1px solid #3c3c3c!important;box-shadow:0 10px 28px #0003}
    .home-tile .sh-icon{width:31px;height:31px;color:#fff;padding:4px;border:1px solid #4a4a4a;border-radius:9px}
    .home-tile strong{font-size:16px;letter-spacing:-.3px}.home-tile small{font-size:11px;color:#aaa;font-weight:550}
    .home-tile:hover{background:linear-gradient(145deg,#303030,#191919)!important;border-color:#777!important;transform:translateY(-3px)!important}
    .header-tools{gap:12px}.notification-wrap{position:relative;flex:0 0 auto!important}
    .bell-button{position:relative;width:46px;height:44px;display:grid;place-items:center;padding:8px;border-radius:12px}
    .bell-button .sh-icon{width:22px;height:22px}.notification-badge{position:absolute;right:-5px;top:-5px;min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;border-radius:99px;background:#f5f5f5;color:#080808;border:2px solid #101010;font-size:10px;font-weight:900}
    .notification-panel{position:absolute;z-index:50;right:0;top:52px;width:min(360px,calc(100vw - 32px));max-height:65vh;overflow:auto;padding:10px;background:#151515;border:1px solid #454545;border-radius:15px;box-shadow:0 20px 60px #000b}
    .notification-panel h3{margin:7px 8px 10px;font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:#aaa}
    .notification-entry{width:100%;display:block;text-align:left;white-space:normal;background:#202020!important;color:#f4f4f4!important;border:1px solid #333!important;border-radius:10px;padding:12px;margin:6px 0;min-height:0}
    .notification-entry strong{display:block;font-size:13px}.notification-entry small{display:block;color:#aaa;margin-top:4px;font-weight:500}
    .new-announcement{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px;margin:12px 0 18px;border:1px solid #777;border-radius:14px;background:linear-gradient(110deg,#242424,#151515);cursor:pointer}
    .new-announcement strong{display:block;font-size:14px}.new-announcement p{margin:4px 0 0;color:#bcbcbc;font-size:12px}.new-announcement .new-label{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;background:#f5f5f5;color:#080808;font-size:10px;letter-spacing:.8px;font-weight:950;white-space:nowrap}
    .coach-calendar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.coach-day{min-height:120px;padding:12px;border:1px solid #333;border-radius:12px;background:#111}.coach-day.today{border-color:#eee;box-shadow:inset 0 0 0 1px #eee}.coach-day .day-date{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.7px}.coach-event{padding:8px;margin-top:8px;background:#222;border-radius:8px;border-left:2px solid #eee;font-size:12px}.coach-event strong{display:block;font-size:12px}.coach-event small{color:#aaa}
    .remove-membership{margin-top:8px}.roster-member{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #292929}.roster-member:last-child{border-bottom:0}.roster-member button{flex:0 0 auto}
    @media(max-width:650px){.home-actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.home-tile{min-height:124px;padding:14px}.coach-calendar{grid-template-columns:repeat(2,minmax(0,1fr))}.top:after{display:none}.header-tools{gap:7px}}
    .auth{max-width:470px;margin:6vh auto}
    .auth>.brand{margin:0 0 22px 4px}
    .auth .card{padding:27px;background:linear-gradient(145deg,#191919,#101010);border-radius:18px;box-shadow:0 20px 70px #0008}
    #authTitle{font-size:30px;letter-spacing:-1px;margin:0 0 5px;font-weight:900}
    #authView>p,.auth .muted{font-size:13px}
    .auth form button[type="submit"]{margin-top:5px;min-height:46px;font-weight:900;letter-spacing:.03em}
    .auth .row button{font-size:12px}
    .champ-hero{border-radius:16px}
    .champ-card,.team-card{box-shadow:0 12px 28px #0004}
    .callup-admin summary{padding:10px 0}
    .coach-card{display:flex;align-items:center;gap:16px;min-width:0}
    .coach-avatar{width:72px;height:72px;flex:0 0 72px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#252525;border:2px solid #eee;font-size:20px;font-weight:900}
    .coach-avatar img{width:100%;height:100%;object-fit:cover}
    .coach-info{min-width:0;overflow-wrap:anywhere}.coach-info h2{margin:0 0 8px}

    /* Navegação e painel inicial com ícones vetoriais personalizados (sem emojis). */
    .nav button{display:inline-flex;align-items:center;gap:9px}
    .sh-icon{width:22px;height:22px;display:inline-block;flex:0 0 22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
    .nav .sh-icon{width:17px;height:17px;flex-basis:17px}
    .home-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:18px 0 24px}
    .home-tile{min-height:142px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px;text-align:left;border:1px solid #393939!important;border-radius:15px!important;background:linear-gradient(145deg,#202020,#111)!important;color:#f5f5f5!important;box-shadow:0 10px 26px #0004}
    .home-tile .sh-icon{width:32px;height:32px;flex-basis:32px}
    .home-tile strong{font-size:16px;letter-spacing:.01em}
    .home-tile small{color:#aaa;font-size:12px;font-weight:500}
    .home-tile:hover{border-color:#aaa!important;background:linear-gradient(145deg,#292929,#151515)!important}
    .rank-athlete{background:none!important;border:0!important;color:#fff!important;padding:3px 0!important;min-height:0!important;text-align:left;text-decoration:underline;text-decoration-color:#555;text-underline-offset:4px}
    .rank-athlete:hover{color:#ccc!important}
    .role-options{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 14px}.role-options label{display:flex;align-items:center;gap:7px}.role-options input{width:auto;min-height:0}
    .weekdays{display:flex;gap:8px;flex-wrap:wrap}.weekdays label{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid #383838;border-radius:8px;background:#111}.weekdays input{width:auto;min-height:0}
    @media(max-width:620px){.home-actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.home-tile{min-height:122px;padding:14px}.home-tile strong{font-size:14px}}

    ::selection{background:#f5f5f5;color:#090909}

      .wrap{padding:14px}

    /* SH — camada visual premium; preserva a lógica e os fluxos existentes */
    :root{--bg:#080808;--panel:#111;--panel2:#191919;--line:#2c2c2c;--text:#f6f6f6;--muted:#a1a1a1;--green:#c7f36b;--red:#ff9c9c;--accent:#d7ff65;--surface:#111}

      <h1 id="authTitle">Entrar</h1>
      <p class="muted">Treinos, atletas, presença e gestão em um só lugar.</p>
      <div id="authMsg" class="notice hidden"></div>
      <form id="loginForm">
        <div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" autocomplete="email" required></div>
        <div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
        <button id="loginButton" type="submit" style="width:100%">Entrar</button>
      </form>
      <form id="signupForm" class="hidden">
        <div class="field"><label for="signupName">Nome completo</label><input id="signupName" required></div>
        <div class="field"><label for="signupPhone">Telefone</label><input id="signupPhone" type="tel"></div>
        <div class="field"><label for="signupEmail">E-mail</label><input id="signupEmail" type="email" required></div>
        <div class="field"><label for="signupPassword">Senha (mínimo 6 caracteres)</label><input id="signupPassword" type="password" minlength="6" required></div>
        <button type="submit" style="width:100%">Criar conta</button>
      </form>
      <div class="row" style="margin-top:12px">
        <button class="secondary" id="toggleSignup" type="button">Criar conta</button>
        <button class="secondary" id="recoverButton" type="button">Esqueci a senha</button>
      </div>
      <p class="muted small">O cadastro e o acesso aos dados dependem das configurações de autenticação e das políticas do Supabase.</p>

      setTimeout(() => el.classList.add('hidden'), 7000);

  function handleError(error, context = 'Erro na operação') {
    console.error(context, error);
    showMessage(

  async function loadProfile() {
    const { data, error } = await db
      .from('perfis')
      .select('*')
      .eq('user_id', user.id)
      .maybeSingle();

    if (error) throw error;

    if (data) {
      profile = data;
    } else {
      profile = {
        user_id: user.id,
        nome: user.user_metadata?.nome || user.email?.split('@')[0] || 'Atleta',
        papel: 'atleta',
        telefone: user.user_metadata?.telefone || null
      };
    }

    isAdmin = hasRole(profile, 'admin');

    $('headerName').textContent = profile.nome || user.email;
    $('headerRole').textContent = roleLabel(profile) || 'Atleta';
    $('adminNav').classList.toggle('hidden', !isAdmin);
  }

  async function loadBase() {
    const queries = [
      ['turmas', () => db.from('turmas').select('*').order('nome')],
      ['treinos', () => db.from('treinos').select('*').order('criado_em', { ascending: false })],
      ['campeonatos', () => db.from('campeonatos').select('*').order('data_evento', { ascending: true })],
      ['mensalidades', () => db.from('mensalidades').select('*').order('vencimento', { ascending: false })],
      ['ranking', () => db.from('ranking_atletas').select('*').order('pontos', { ascending: false })],
      ['avisos', () => db.from('announcements').select('*').order('created_at', { ascending: false })]
    ];

    for (const [key, query] of queries) {
      const { data, error } = await query();

      if (error) {
        console.warn(`Não carregou ${key}:`, error.message);
        dataCache[key] = [];
      } else {
        dataCache[key] = data || [];
      }
    }

    const { data, error } = await db.from('perfis').select('*').order('nome');

    if (error) {
      console.warn('Não carregou perfis:', error.message);
    } else {
      dataCache.perfis = data || [];
    }
  }

  async function openPage(name){
    currentPage=name;
    setPageButtons();
    const c=$('content');
    c.innerHTML='<div class="card">Carregando...</div>';
    try{
      switch(name){
        case 'inicio':await renderHome(c);break;
        case 'perfil':await renderProfile(c);break;
        case 'treinos':await renderTrainings(c);break;
        case 'campeonatos':await renderChampionships(c);break;
        case 'mensalidades':await renderBills(c);break;
        case 'presencas':await renderAttendance(c);break;
        case 'ranking':await renderRanking(c);break;
        case 'avisos':await renderAnnouncements(c);break;
        case 'treinadores':if(!canSeeCoaches()){currentPage='inicio';await renderHome(c);}else{await renderCoaches(c);}break;
        case 'admin':await renderAdmin(c);break;
        default:await renderHome(c);
      }
      const refresh=$('refreshCurrent');
      if(refresh)refresh.onclick=()=>openPage(currentPage);
    }catch(error){
      console.error(error);
      c.innerHTML=`<div class="card"><h2>Não foi possível abrir esta tela</h2><p class="muted">${esc(error.message)}</p><button onclick="location.reload()">Recarregar página</button></div>`;
    }
  }

  async function startApp(){
    await loadProfile();

    if (!canSeeCoaches() && currentPage === 'treinadores') currentPage = 'inicio';

          </div><button type="submit">Salvar perfil</button>
        </form>
      </section>`;

    const photoInput=$('profilePhotoInput');
    if(photoInput)photoInput.onchange=()=>{const file=photoInput.files?.[0];if(!file)return;const preview=$('profilePhotoPreview');preview.src=URL.createObjectURL(file);preview.style.display='block';};
    $('profileForm').onsubmit=async e=>{
      e.preventDefault();
      const f=new FormData(e.target);
      const patch={
        nome:String(f.get('nome')).trim(),
        telefone:String(f.get('telefone')||'').trim()||null,
        responsavel:String(f.get('responsavel')||'').trim()||null,

        if(photoFile.size>6*1024*1024)return showMessage('A foto deve ter até 6 MB.','error');
        try{patch.foto_url=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const canvas=document.createElement('canvas');const scale=Math.min(1,600/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.78));};img.src=reader.result;};reader.readAsDataURL(photoFile);});}catch(_){return showMessage('Não foi possível processar a foto.','error');}
      }
      const {error}=await db.from('perfis').update(patch).eq('user_id',user.id);

  async function renderCoaches(c){
    await loadBase();
    const profiles=Array.isArray(dataCache.perfis)?dataCache.perfis:[];
    const coaches=profiles.filter(p=>hasRole(p,'tecnico')||/treinador|coach|técnico|tecnico|professor/i.test(String(p.papel||'')));
    const start=new Date();start.setHours(0,0,0,0);const days=Array.from({length:15},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d;});
    let classes=[],assignments=[],fixed=[];
    const [a,b,d]=await Promise.all([db.from('agenda_aulas').select('*'),db.from('agenda_aula_professores').select('*'),db.from('turmas_professores').select('*')]);
    const scheduleError=a.error||b.error||d.error;
    if(!scheduleError){classes=a.data||[];assignments=b.data||[];fixed=d.data||[];}
    const canManage=isAdmin;
    const eventRows=[];
    for(const day of days){for(const lesson of classes){let occurs=false;const date=day.toISOString().slice(0,10);if(lesson.recorrente){const weekday=['domingo','segunda','terça','quarta','quinta','sexta','sábado'][day.getDay()];occurs=(lesson.dias_semana||[]).some(x=>String(x).toLowerCase().startsWith(weekday.slice(0,3)))&&(!lesson.data_inicio||date>=lesson.data_inicio)&&(!lesson.data_fim||date<=lesson.data_fim);}else occurs=lesson.data_aula===date;if(occurs)eventRows.push({date,lesson,teachers:[...new Set([...assignments.filter(x=>String(x.aula_id)===String(lesson.id)).map(x=>personName(x.professor_id)),...fixed.filter(x=>lesson.turma_id&&String(x.turma_id)===String(lesson.turma_id)).map(x=>personName(x.professor_id))])]});}}
    const calendar=days.map(day=>{const date=day.toISOString().slice(0,10);const events=eventRows.filter(e=>e.date===date);return `<div class="coach-day ${date===today()?'today':''}"><div class="day-date">${['dom','seg','ter','qua','qui','sex','sáb'][day.getDay()]} · ${day.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</div>${events.map(e=>`<div class="coach-event"><strong>${esc(e.lesson.titulo)}</strong><small>${esc(e.lesson.horario_inicio||'')} ${e.lesson.horario_fim?'– '+esc(e.lesson.horario_fim):''} · ${esc(e.lesson.local||'Local a definir')}</small><small>Prof.: ${esc(e.teachers.join(', ')||'Sem professor atribuído')}</small><small>Turma: ${esc(teamName(e.lesson.turma_id)||'Geral')}</small></div>`).join('')||'<p class="muted small">Sem aulas</p>'}</div>`;}).join('');
    const form=canManage?`<section class="card"><h2>Adicionar aula à agenda</h2><p class="muted small">Uma aula pode ter vários professores. Cadastre uma ocorrência única ou uma agenda recorrente por dias da semana.</p><form id="coachLessonForm"><div class="grid"><div class="field"><label>Nome da aula</label><input name="titulo" required placeholder="Ex.: Treino técnico Sub-17"></div><div class="field"><label>Turma</label><select name="turma_id"><option value="">Sem turma específica</option>${dataCache.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select></div><div class="field"><label>Local</label><input name="local" placeholder="João do Pulo"></div><div class="field"><label>Início</label><input name="inicio" type="time" required></div><div class="field"><label>Fim</label><input name="fim" type="time"></div><div class="field"><label>Tipo de agenda</label><select name="recorrente"><option value="true">Recorrente</option><option value="false">Aula única</option></select></div><div class="field" data-coach-date><label>Data da aula única</label><input name="data_aula" type="date" min="${today()}"></div><div class="field" data-coach-start><label>Começar recorrência em</label><input name="data_inicio" type="date" value="${today()}"></div><div class="field" data-coach-end><label>Encerrar recorrência (opcional)</label><input name="data_fim" type="date"></div></div><div class="field" data-coach-weekdays><label>Dias da semana</label><div class="role-options">${[['segunda','Segunda'],['terça','Terça'],['quarta','Quarta'],['quinta','Quinta'],['sexta','Sexta'],['sábado','Sábado'],['domingo','Domingo']].map(([v,l])=>`<label><input type="checkbox" name="dias_semana" value="${v}"> ${l}</label>`).join('')}</div></div><div class="field"><label>Professores desta aula (pode escolher vários)</label><div class="grid">${coaches.map(p=>`<label class="checkline"><input type="checkbox" name="professores" value="${p.user_id}"> ${esc(p.nome)}</label>`).join('')||'<p class="muted">Cadastre a função Técnico em Administração primeiro.</p>'}</div></div><button>Salvar aula na agenda</button></form></section><section class="card"><h2>Professor fixo por turma</h2><form id="fixedCoachForm"><div class="grid"><div class="field"><label>Turma</label><select name="turma_id" required><option value="">Selecione</option>${dataCache.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select></div><div class="field"><label>Professor fixo</label><select name="professor_id" required><option value="">Selecione</option>${coaches.map(p=>`<option value="${p.user_id}">${esc(p.nome)}</option>`).join('')}</select></div></div><button>Definir professor fixo</button></form><div>${fixed.map(f=>`<div class="roster-member"><span>${esc(teamName(f.turma_id))} — ${esc(personName(f.professor_id))}</span><button type="button" class="danger" data-fixed-delete="${f.id}">Remover</button></div>`).join('')||'<p class="muted small">Nenhum professor fixo definido.</p>'}</div></section>`:'';
    c.innerHTML=pageHeader('Treinadores','Calendário atualizado com os próximos 15 dias.')+`<section class="card"><div class="section-head"><div><h2>Próximos 15 dias</h2><p class="muted small">Janela móvel: ${dateBR(days[0].toISOString().slice(0,10))} – ${dateBR(days[14].toISOString().slice(0,10))}</p></div><button class="secondary" id="refreshCoachCalendar">Atualizar calendário</button></div>${scheduleError?`<div class="notice error">Para ativar a agenda, execute o SQL de configuração que acompanha este arquivo. (${esc(scheduleError.message)})</div>`:`<div class="coach-calendar">${calendar}</div>`}</section><section class="card"><h2>Equipe técnica</h2><div class="grid">${coaches.map(p=>`<article class="card coach-card"><div class="coach-avatar">${p.foto_url?`<img src="${esc(p.foto_url)}" alt="Foto de ${esc(p.nome||'treinador')}">`:`<span>${esc(String(p.nome||'SH').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase())}</span>`}</div><div class="coach-info"><h2>${esc(p.nome||'Treinador')}</h2><span class="pill">${esc(roleLabel(p))}</span>${p.telefone?`<p class="muted small">Contato: ${esc(p.telefone)}</p>`:''}</div></article>`).join('')||'<p class="muted">Nenhum técnico cadastrado.</p>'}</div></section>${form}`;
    const rec=$('coachLessonForm')?.elements.recorrente;const syncRec=()=>{const unique=rec?.value==='false';c.querySelector('[data-coach-date]')?.classList.toggle('hidden',!unique);c.querySelector('[data-coach-start]')?.classList.toggle('hidden',unique);c.querySelector('[data-coach-end]')?.classList.toggle('hidden',unique);c.querySelector('[data-coach-weekdays]')?.classList.toggle('hidden',unique);};if(rec){rec.onchange=syncRec;syncRec();$('coachLessonForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),unique=f.get('recorrente')==='false',teachers=[...e.target.querySelectorAll('[name="professores"]:checked')].map(x=>x.value),weekdays=[...e.target.querySelectorAll('[name="dias_semana"]:checked')].map(x=>x.value);if(!teachers.length)return showMessage('Selecione pelo menos um professor.','error');if(!unique&&!weekdays.length)return showMessage('Selecione ao menos um dia da semana.','error');const payload={titulo:f.get('titulo'),turma_id:f.get('turma_id')||null,local:f.get('local')||null,horario_inicio:f.get('inicio'),horario_fim:f.get('fim')||null,recorrente:!unique,data_aula:unique?f.get('data_aula'):null,dias_semana:unique?[]:weekdays,data_inicio:unique?null:(f.get('data_inicio')||today()),data_fim:unique?(null):(f.get('data_fim')||null),criado_por:user.id};const {data,error}=await db.from('agenda_aulas').insert(payload).select('id').single();if(error)return handleError(error,'Não foi possível salvar a aula');const rows=teachers.map(professor_id=>({aula_id:data.id,professor_id}));const {error:teacherError}=await db.from('agenda_aula_professores').insert(rows);if(teacherError){await db.from('agenda_aulas').delete().eq('id',data.id);return handleError(teacherError,'Não foi possível vincular os professores');}showMessage('Aula adicionada ao calendário.');await renderCoaches(c);};}
    $('fixedCoachForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from('turmas_professores').upsert({turma_id:f.get('turma_id'),professor_id:f.get('professor_id')},{onConflict:'turma_id,professor_id'});if(error)return handleError(error,'Não foi possível definir o professor fixo');showMessage('Professor fixo definido.');await renderCoaches(c);});
    c.querySelectorAll('[data-fixed-delete]').forEach(btn=>btn.onclick=async()=>{const {error}=await db.from('turmas_professores').delete().eq('id',btn.dataset.fixedDelete);if(error)return handleError(error,'Não foi possível remover o professor fixo');await renderCoaches(c);});
    $('refreshCoachCalendar')?.addEventListener('click',()=>renderCoaches(c));
  }

  async function renderAdmin(c){
    if(!isAdmin){c.innerHTML='<div class="card">Acesso restrito.</div>';return;}
    await loadBase();
    c.innerHTML=pageHeader('Administração','Resumo e gerenciamento de turmas e atletas.')+`
      <div class="stats"><div class="stat"><strong>${dataCache.perfis.length}</strong><span>Perfis</span></div><div class="stat"><strong>${dataCache.turmas.length}</strong><span>Turmas</span></div><div class="stat"><strong>${dataCache.treinos.length}</strong><span>Treinos</span></div><div class="stat"><strong>${dataCache.mensalidades.filter(b=>b.status!=='pago').length}</strong><span>Cobranças pendentes</span></div></div>
      <section class="card"><h2>Atletas cadastrados</h2><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Papel</th><th>Telefone</th><th>Responsável</th><th>Idade</th></tr></thead><tbody>${dataCache.perfis.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(roleLabel(p))}</td><td>${esc(p.telefone||'—')}</td><td>${esc(p.responsavel||'—')}</td><td>${esc(p.idade||'—')}</td></tr>`).join('')||'<tr><td colspan="5">Sem perfis visíveis para sua conta.</td></tr>'}</tbody></table></div></section>
      <section class="card"><h2>Gerenciar funções</h2><p class="muted small">Uma pessoa pode ter várias funções. As funções ficam separadas do papel principal para preservar as permissões do sistema.</p><form id="roleForm"><div class="grid"><div class="field"><label>Perfil</label><select name="user_id" required><option value="">Selecione uma pessoa</option>${dataCache.perfis.map(p=>`<option value="${p.user_id}">${esc(p.nome)} — ${esc(roleLabel(p))}</option>`).join('')}</select></div></div><div class="role-options"><label><input type="checkbox" name="roles" value="atleta"> Atleta</label><label><input type="checkbox" name="roles" value="tecnico"> Técnico</label><label><input type="checkbox" name="roles" value="admin"> Administrador</label></div><button>Salvar funções</button></form></section>
      <section class="card"><h2>Criar turma</h2><form id="teamForm"><div class="grid"><div class="field"><label>Nome da turma</label><input name="nome" required></div><div class="field"><label>Categoria</label><input name="categoria" required placeholder="Sub-17, feminino, adulto..."></div><div class="field"><label>Descrição</label><input name="descricao"></div></div><button>Criar turma</button></form></section>
      <section class="card"><h2>Vincular atleta à turma</h2><form id="linkForm"><div class="grid"><div class="field"><label>Atleta</label><select name="atleta_id" required><option value="">Selecione</option>${dataCache.perfis.filter(p=>(hasRole(p,'atleta')||!hasRole(p,'admin'))).map(p=>`<option value="${p.user_id}">${esc(p.nome)}</option>`).join('')}</select></div><div class="field"><label>Turma</label><select name="turma_id" required><option value="">Selecione</option>${dataCache.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('')}</select></div></div><button>Vincular atleta</button></form></section>
      <section class="card"><h2>Atletas por turma</h2><div id="teamRosterList">Carregando...</div></section>`;
    $('teamForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from('turmas').insert({nome:f.get('nome'),categoria:f.get('categoria'),descricao:f.get('descricao')||null,ativo:true,criado_por:user.id});if(error)return handleError(error,'Erro ao criar turma');showMessage('Turma criada.');await renderAdmin(c);};
    $('roleForm').elements.user_id.onchange=()=>{const p=dataCache.perfis.find(x=>x.user_id===$('roleForm').elements.user_id.value);const roles=profileRoles(p);$('roleForm').querySelectorAll('[name="roles"]').forEach(el=>el.checked=roles.includes(el.value)||(el.value==='admin'&&roles.includes('administrador'))||(el.value==='tecnico'&&roles.some(r=>['treinador','professor','técnico'].includes(r))));};
    $('roleForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const target=f.get('user_id');const roles=[...e.target.querySelectorAll('[name="roles"]:checked')].map(el=>el.value);if(!roles.length)return showMessage('Selecione pelo menos uma função.','error');const primaryRole=roles.includes('admin')?'admin':'atleta';const {error}=await db.from('perfis').update({papel:primaryRole,funcoes:roles}).eq('user_id',target);if(error)return handleError(error,'Não foi possível atualizar as funções');showMessage('Funções atualizadas.');await loadProfile();await renderAdmin(c);};
    $('linkForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await db.from('turma_atletas').upsert({atleta_id:f.get('atleta_id'),turma_id:f.get('turma_id')},{onConflict:'turma_id,atleta_id'});if(error)return handleError(error,'Erro ao vincular atleta');showMessage('Atleta vinculado à turma.');await renderAdmin(c);};
    const rosterBox=$('teamRosterList');
    const {data:links,error}=await db.from('turma_atletas').select('turma_id,atleta_id');
    if(error){rosterBox.textContent=error.message;return;}
    rosterBox.innerHTML=dataCache.turmas.map(t=>{const teamLinks=(links||[]).filter(l=>String(l.turma_id)===String(t.id));return `<div class="item"><strong>${esc(t.nome)}</strong>${teamLinks.map(l=>`<div class="roster-member"><span>${esc(personName(l.atleta_id))}</span><button type="button" class="danger" data-unlink-athlete="${l.atleta_id}" data-unlink-team="${t.id}">Tirar da turma</button></div>`).join('')||'<p class="muted small">Nenhum atleta vinculado</p>'}</div>`}).join('')||'<p class="muted">Nenhuma turma cadastrada.</p>';
    rosterBox.querySelectorAll('[data-unlink-athlete]').forEach(btn=>btn.onclick=async()=>{if(!confirm(`Tirar ${personName(btn.dataset.unlinkAthlete)} desta turma?`))return;const {error}=await db.from('turma_atletas').delete().eq('turma_id',btn.dataset.unlinkTeam).eq('atleta_id',btn.dataset.unlinkAthlete);if(error)return handleError(error,'Não foi possível tirar o atleta da turma');showMessage('Atleta removido da turma.');await renderAdmin(c);});
  }

  async function refreshNotifications(){
    if(!user||!db)return;await loadBase();
    const recent=(dataCache.avisos||[]).filter(a=>a.created_at&&Date.now()-new Date(a.created_at).getTime()<48*60*60*1000).filter(a=>a.target_type==='all'||(a.target_type==='athlete'&&a.target_athlete_id===user.id)||(a.target_type==='class'&&dataCache.turmas.some(t=>String(t.id)===String(a.target_class_id))));
    const {data:callups}=await db.from('convocacoes').select('id,campeonato_id,criado_em,team_name').eq('atleta_id',user.id).order('criado_em',{ascending:false}).limit(10);
    const items=[...recent.map(a=>({id:'notice-'+a.id,title:a.title,message:a.message,date:a.created_at,page:'avisos'})),...(callups||[]).map(a=>({id:'callup-'+a.id,title:'Você foi convocado',message:a.team_name||'Confira os campeonatos e sua convocação.',date:a.criado_em,page:'campeonatos'}))].sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    const seen=JSON.parse(localStorage.getItem('spooky_seen_notifications_'+user.id)||'[]');const unread=items.filter(x=>!seen.includes(x.id));const badge=$('notificationBadge');if(badge){badge.textContent=unread.length>9?'9+':String(unread.length);badge.classList.toggle('hidden',unread.length===0);}
    const panel=$('notificationPanel');if(panel)panel.innerHTML=`<h3>Notificações</h3>${items.map(x=>`<button class="notification-entry" type="button" data-notification-id="${esc(x.id)}" data-notification-page="${x.page}"><strong>${esc(x.title)}${seen.includes(x.id)?'':' · NOVO'}</strong><small>${esc(x.message||'')} · ${x.date?new Date(x.date).toLocaleString('pt-BR'):''}</small></button>`).join('')||'<p class="muted small" style="padding:10px">Nenhuma notificação por enquanto.</p>'}`;
    panel?.querySelectorAll('[data-notification-id]').forEach(btn=>btn.onclick=()=>{const key='spooky_seen_notifications_'+user.id;const arr=JSON.parse(localStorage.getItem(key)||'[]');arr.push(btn.dataset.notificationId);localStorage.setItem(key,JSON.stringify([...new Set(arr)]));panel.classList.add('hidden');openPage(btn.dataset.notificationPage);refreshNotifications();});
  }
  $('notificationBell')?.addEventListener('click',async e=>{e.stopPropagation();const panel=$('notificationPanel');panel.classList.toggle('hidden');if(!panel.classList.contains('hidden'))await refreshNotifications();});
  document.addEventListener('click',e=>{if(!e.target.closest('.notification-wrap'))$('notificationPanel')?.classList.add('hidden');});

  $('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();if(!db)return showMessage('Biblioteca Supabase não carregou. Verifique a internet.','error',false);
    $('loginButton').disabled=true;
    const {data,error}=await db.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});
    $('loginButton').disabled=false;
    if(error)return showMessage(error.message,'error',false);
    user=data.user;session=data.session;
    try{await startApp();}catch(err){handleError(err,'Não foi possível carregar seu perfil');}
  });
  $('toggleSignup').onclick=()=>{const show=$('signupForm').classList.toggle('hidden');$('loginForm').classList.toggle('hidden',show);$('authTitle').textContent=show?'Criar conta':'Entrar';$('toggleSignup').textContent=show?'Voltar para entrar':'Criar conta';$('recoverButton').classList.toggle('hidden',show);};
  $('signupForm').addEventListener('submit',async e=>{
    e.preventDefault();const {data,error}=await db.auth.signUp({email:$('signupEmail').value.trim(),password:$('signupPassword').value,options:{data:{nome:$('signupName').value.trim(),telefone:$('signupPhone').value.trim()}}});
    if(error)return showMessage(error.message,'error',false);
    if(data.session&&data.user){
      user=data.user;session=data.session;
      const {error:profileError}=await db.from('perfis').upsert({user_id:user.id,nome:$('signupName').value.trim(),telefone:$('signupPhone').value.trim()||null,papel:'atleta'},{onConflict:'user_id'});
      if(profileError)console.warn('Perfil pode depender de trigger no banco:',profileError.message);
      try{await startApp();}catch(err){handleError(err,'Conta criada, mas não foi possível carregar o perfil');}
    }else showMessage('Cadastro iniciado. Confirme seu e-mail e depois entre na plataforma.','ok',false);
  });
  $('recoverButton').onclick=async()=>{const email=$('loginEmail').value.trim();if(!email)return showMessage('Digite seu e-mail no campo acima.','error',false);const {error}=await db.auth.resetPasswordForEmail(email);if(error)return showMessage(error.message,'error',false);showMessage('Se o e-mail estiver cadastrado, você receberá as instruções.','ok',false);};
  $('logoutButton').onclick=async()=>{await db.auth.signOut();user=null;session=null;profile=null;isAdmin=false;setAppVisible(false);};
  $('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)openPage(b.dataset.page);});
  $('content').addEventListener('click',e=>{if(e.target.closest('[data-back-home]'))openPage('inicio');});

  async function boot(){
    if(!db){showMessage('Não foi possível carregar o cliente Supabase.','error',false);return;}
    const {data,error}=await db.auth.getSession();if(error)console.warn(error.message);
    if(data?.session){session=data.session;user=session.user;try{await startApp();}catch(err){handleError(err,'Erro ao iniciar a sessão');setAppVisible(false);}}
    else setAppVisible(false);
    db.auth.onAuthStateChange(async(_event,newSession)=>{
      if(newSession&&!user){session=newSession;user=newSession.user;try{await startApp();}catch(err){console.error(err);}}
      if(!newSession){session=null;user=null;profile=null;isAdmin=false;setAppVisible(false);}
    });
  }
  boot();
})();
</script>
