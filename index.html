
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spooky House | A Casa do Basquete</title>
<style>
:root{color-scheme:dark;--bg:#070707;--panel:#121212;--line:#303030;--muted:#aaa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font:15px Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:12px}
.logo{font-size:24px;font-weight:900;letter-spacing:4px}
main{max-width:1000px;margin:auto;padding:22px 15px 50px}
.box,.card,.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.auth{max-width:440px;margin:8vh auto;padding:18px}
h1,h2,h3{margin-top:0}
p{color:var(--muted);line-height:1.5}
label{display:block;font-size:13px;color:#ccc;margin:13px 0 6px}
input,select{width:100%;padding:12px;border-radius:7px;border:1px solid #444;background:#080808;color:white}
button{padding:11px 14px;border-radius:7px;border:1px solid #555;background:#171717;color:white}
.primary{background:white;color:black;font-weight:bold;border-color:white}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{text-align:left;color:white;min-height:110px}
.card h3{margin:10px 0}
.muted{font-size:13px;color:var(--muted)}
.msg{padding:12px;margin-top:12px;border-radius:7px;background:#202020;line-height:1.5}
.item h3{margin-bottom:7px}
.item p{margin:6px 0;font-size:14px}
.badge{display:inline-block;border:1px solid #555;border-radius:20px;padding:5px 8px;font-size:11px;margin:0 5px 6px 0}
@media(max-width:600px){.grid{grid-template-columns:1fr}header{flex-wrap:wrap}.auth{margin-top:3vh}}
</style>
</head>
<body>

<section id="authScreen" class="auth">
  <div style="text-align:center;margin-bottom:25px">
    <div class="logo" style="font-size:40px">SPOOKY</div>
    <p>A CASA DO BASQUETE</p>
  </div>
  <div class="box">
    <div id="loginArea">
      <h2>Entrar</h2>
      <form id="loginForm">
        <label>E-mail</label>
        <input id="loginEmail" type="email" autocomplete="email" required>
        <label>Senha</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
        <div class="actions">
          <button class="primary" style="width:100%" type="submit">ENTRAR</button>
        </div>
      </form>
      <div class="actions">
        <button id="showSignup" type="button">Criar minha conta</button>
        <button id="forgot" type="button">Esqueci a senha</button>
      </div>
    </div>

    <div id="signupArea" class="hidden">
      <h2>Cadastro de atleta</h2>
      <p>Crie sua conta para acessar a área do atleta.</p>
      <form id="signupForm">
        <label>Nome completo</label>
        <input id="signupName" maxlength="100" required>
        <label>Telefone / WhatsApp</label>
        <input id="signupPhone" type="tel" maxlength="30" required>
        <label>Nome do responsável (se menor de idade)</label>
        <input id="signupResponsible" maxlength="100">
        <label>E-mail</label>
        <input id="signupEmail" type="email" autocomplete="email" required>
        <label>Crie uma senha (mínimo de 8 caracteres)</label>
        <input id="signupPassword" type="password" minlength="8" autocomplete="new-password" required>
        <div class="actions">
          <button class="primary" type="submit">CRIAR CONTA</button>
          <button id="backLogin" type="button">Voltar</button>
        </div>
      </form>
    </div>
    <div id="authMessage" class="msg hidden" role="status"></div>
  </div>
  <p style="text-align:center;font-size:11px">SPOOKY HOUSE • A CASA DO BASQUETE</p>
</section>

<section id="appScreen" class="hidden">
  <header>
    <div class="logo">SPOOKY</div>
    <div>
      <span id="roleBadge" class="badge">ATLETA</span>
      <button id="logout">Sair</button>
    </div>
  </header>
  <main>
    <h1>Olá, <span id="userName">Atleta</span>.</h1>
    <p>Bem-vindo à Casa do Basquete.</p>

    <div id="adminDashboard" class="box hidden">
      <h2>Painel do administrador</h2>
      <div class="grid">
        <button class="card" data-page="atletas"><h3>Atletas e turmas</h3><p>Consultar atletas e definir suas turmas.</p></button>
        <button class="card" data-page="financeiro"><h3>Mensalidades</h3><p>Criar cobranças e registrar pagamentos.</p></button>
        <button class="card" data-page="treinos"><h3>Treinos</h3><p>Consultar a programação.</p></button>
        <button class="card" data-page="campeonatos"><h3>Campeonatos</h3><p>Consultar as competições.</p></button>
      </div>
    </div>

    <div id="athleteDashboard" class="box">
      <div class="grid">
        <button class="card" data-page="minha-turma"><h3>Minha turma</h3><p>Veja a turma definida pela equipe.</p></button>
        <button class="card" data-page="minhas-mensalidades"><h3>Minhas mensalidades</h3><p>Consulte valores e vencimentos.</p></button>
        <button class="card" data-page="treinos"><h3>Treinos</h3><p>Consulte os horários.</p></button>
        <button class="card" data-page="campeonatos"><h3>Campeonatos</h3><p>Consulte as competições.</p></button>
      </div>
    </div>

    <section id="content" class="box hidden">
      <div class="actions" style="justify-content:space-between">
        <h2 id="pageTitle">Área</h2>
        <button id="closePage">Fechar</button>
      </div>
      <div id="pageMessage" class="msg hidden"></div>
      <div id="pageForm"></div>
      <div id="pageList"></div>
    </section>
  </main>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
"use strict";

const SUPABASE_URL = "https://mcrreffapstciqpsgvro.supabase.co";
const SUPABASE_KEY = "sb_publishable_S798hSSxNl63S2sgDYJoog_tl-N6poI";
const $ = id => document.getElementById(id);
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;
let profile = null;
let admin = false;
let page = "";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function message(id, text) {
  $(id).textContent = text;
  $(id).classList.remove("hidden");
}
function hide(id) { $(id).classList.add("hidden"); }

function authMessage(text) { message("authMessage", text); }
function pageMessage(text) { message("pageMessage", text); }

function money(value) {
  return Number(value || 0).toLocaleString("pt-BR", {
    style:"currency", currency:"BRL"
  });
}
function dateBR(value) {
  if (!value) return "Não informado";
  const a = value.slice(0,10).split("-");
  return a.length === 3 ? `${a[2]}/${a[1]}/${a[0]}` : value;
}
function input(label,id,type="text",required=true,value="") {
  return `<label for="${id}">${label}</label>
  <input id="${id}" type="${type}" value="${esc(value)}"
  ${required?"required":""}>`;
}
function select(label,id,options,value="") {
  return `<label for="${id}">${label}</label><select id="${id}">
  ${options.map(o=>`<option value="${esc(o)}" ${o===value?"selected":""}>${esc(o||"Selecione")}</option>`).join("")}
  </select>`;
}

$("showSignup").onclick = () => {
  hide("loginArea");
  $("signupArea").classList.remove("hidden");
  hide("authMessage");
};
$("backLogin").onclick = () => {
  hide("signupArea");
  $("loginArea").classList.remove("hidden");
  hide("authMessage");
};

$("signupForm").onsubmit = async e => {
  e.preventDefault();
  const btn = e.submitter;
  btn.disabled = true;
  try {
    const nome = $("signupName").value.trim();
    const telefone = $("signupPhone").value.trim();
    const responsavel = $("signupResponsible").value.trim();
    const email = $("signupEmail").value.trim();
    const password = $("signupPassword").value;

    const {data,error} = await db.auth.signUp({
      email,
      password,
      options:{
        data:{nome,telefone,responsavel},
        emailRedirectTo:location.origin
      }
    });
    if (error) throw error;

    if (data.session) {
      await start(data.user);
      return;
    }
    authMessage("Cadastro iniciado! Se o Supabase pedir confirmação por e-mail, confirme seu endereço antes de entrar. Depois faça login.");
  } catch(err) {
    authMessage("Erro no cadastro: " + err.message);
  } finally {
    btn.disabled = false;
  }
};

$("loginForm").onsubmit = async e => {
  e.preventDefault();
  const btn = e.submitter;
  btn.disabled = true;
  try {
    const {data,error} = await db.auth.signInWithPassword({
      email:$("loginEmail").value.trim(),
      password:$("loginPassword").value
    });
    if (error) throw error;
    await start(data.user);
  } catch(err) {
    authMessage("Não foi possível entrar. Confira e-mail e senha. " + err.message);
  } finally {
    btn.disabled = false;
  }
};

$("forgot").onclick = async () => {
  const email = $("loginEmail").value.trim();
  if (!email) return authMessage("Digite seu e-mail no campo de login.");
  const {error} = await db.auth.resetPasswordForEmail(email, {
    redirectTo:location.origin
  });
  authMessage(error ? error.message : "Se o e-mail estiver cadastrado, você receberá as instruções.");
};

async function start(authUser) {
  user = authUser;
  const {data:p,error} = await db.from("perfis")
    .select("user_id,nome,papel,telefone,responsavel,turma")
    .eq("user_id",user.id).maybeSingle();

  if (error || !p) {
    alert("Não consegui carregar seu perfil. Confira o SQL de configuração do Supabase.");
    return;
  }

  profile = p;
  admin = p.papel === "admin";

  hide("authScreen");
  $("appScreen").classList.remove("hidden");
  $("userName").textContent = p.nome || user.email;
  $("roleBadge").textContent = admin ? "ADMINISTRADOR" : "ATLETA";
  $("adminDashboard").classList.toggle("hidden",!admin);
  $("athleteDashboard").classList.toggle("hidden",admin);
}

$("logout").onclick = async () => {
  await db.auth.signOut();
  location.reload();
};

document.querySelectorAll("[data-page]").forEach(b => {
  b.onclick = () => openPage(b.dataset.page);
});
$("closePage").onclick = () => hide("content");

function openPage(name) {
  page = name;
  $("content").classList.remove("hidden");
  $("pageForm").innerHTML = "";
  $("pageList").innerHTML = "";
  hide("pageMessage");

  const titles = {
    atletas:"Atletas e turmas",
    financeiro:"Mensalidades",
    "minha-turma":"Minha turma",
    "minhas-mensalidades":"Minhas mensalidades",
    treinos:"Treinos",
    campeonatos:"Campeonatos"
  };
  $("pageTitle").textContent = titles[name] || "Área";

  if (name === "atletas" && admin) loadAthletes();
  else if (name === "financeiro" && admin) loadBills(true);
  else if (name === "minhas-mensalidades" && !admin) loadBills(false);
  else if (name === "minha-turma" && !admin) loadMyTeam();
  else if (name === "treinos") loadSimple("treinos");
  else if (name === "campeonatos") loadSimple("campeonatos");
  else pageMessage("Área não disponível para esta conta.");
}

async function loadAthletes() {
  $("pageForm").innerHTML = `
    <h3>Turmas disponíveis</h3>
    <p class="muted">Edite o campo de turma de cada atleta. Você pode usar os nomes abaixo ou cadastrar uma nova turma digitando outro nome.</p>
    <p class="muted">Academy Masculina • Academy Feminina • Adulto • Open • Sub-21</p>`;
  const {data,error} = await db.from("perfis")
    .select("user_id,nome,telefone,responsavel,turma")
    .order("nome");
  if (error) return pageMessage("Erro ao carregar atletas: " + error.message);

  $("pageList").innerHTML = (data||[]).map(a => `
    <div class="item">
      <h3>${esc(a.nome||"Atleta")}</h3>
      <p>Telefone: ${esc(a.telefone||"Não informado")}</p>
      <p>Responsável: ${esc(a.responsavel||"Não informado")}</p>
      <p>Turma atual: ${esc(a.turma||"Sem turma definida")}</p>
      <form data-team-form="${a.user_id}">
        <label>Definir / alterar turma</label>
        <input name="turma" value="${esc(a.turma||"")}" placeholder="Ex.: Academy Masculina">
        <button class="primary" type="submit">Salvar turma</button>
      </form>
    </div>`).join("") || "<p>Nenhum atleta cadastrado.</p>";

  $("pageList").querySelectorAll("[data-team-form]").forEach(form => {
    form.onsubmit = async e => {
      e.preventDefault();
      const turma = new FormData(form).get("turma").trim();
      const {error} = await db.from("perfis")
        .update({turma:turma||null})
        .eq("user_id",form.dataset.teamForm);
      if (error) return pageMessage("Erro ao salvar turma: " + error.message);
      pageMessage("Turma atualizada.");
      loadAthletes();
    };
  });
}

async function loadBills(forAdmin) {
  if (forAdmin) {
    const {data:athletes,error:aError} = await db.from("perfis")
      .select("user_id,nome").order("nome");
    if (aError) return pageMessage("Erro ao carregar atletas: " + aError.message);

    $("pageForm").innerHTML = `
      <h3>Cadastrar mensalidade</h3>
      <form id="billForm">
        ${select("Atleta","billAthlete",(athletes||[]).map(a=>a.user_id+"|"+a.nome))}
        ${input("Valor em reais","billValue","number",true)}
        ${input("Data de vencimento","billDue","date",true)}
        ${input("Descrição","billDesc","text",false)}
        <button class="primary" type="submit">Cadastrar cobrança</button>
      </form>`;
    const sel = $("billAthlete");
    [...sel.options].forEach(o => {
      if(o.value) o.textContent = o.value.split("|").slice(1).join("|");
    });

    $("billForm").onsubmit = async e => {
      e.preventDefault();
      const athleteId = $("billAthlete").value.split("|")[0];
      const value = Number($("billValue").value);
      const vencimento = $("billDue").value;
      const descricao = $("billDesc").value.trim();
      if (!athleteId || !vencimento || value < 0) {
        return pageMessage("Confira atleta, valor e vencimento.");
      }
      const {error} = await db.from("mensalidades").insert({
        atleta_id:athleteId,
        valor:value,
        vencimento,
        descricao:descricao||null,
        criado_por:user.id,
        status:"pendente"
      });
      if (error) return pageMessage("Erro ao cadastrar: " + error.message);
      pageMessage("Mensalidade cadastrada.");
      $("billForm").reset();
      showBillList(true);
    };
    await showBillList(true);
  } else {
    await showBillList(false);
  }
}

async function showBillList(forAdmin) {
  let query = db.from("mensalidades")
    .select("id,atleta_id,valor,vencimento,status,descricao,pago_em")
    .order("vencimento",{ascending:true});
  if (!forAdmin) query = query.eq("atleta_id",user.id);
  const {data,error} = await query;
  if (error) return pageMessage("Erro ao carregar mensalidades: " + error.message);

  let names = {};
  if (forAdmin && data?.length) {
    const ids = [...new Set(data.map(b=>b.atleta_id))];
    const result = await db.from("perfis").select("user_id,nome").in("user_id",ids);
    (result.data||[]).forEach(p=>names[p.user_id]=p.nome);
  }

  $("pageList").innerHTML = (data||[]).map(b => `
    <div class="item">
      <h3>${esc(forAdmin ? (names[b.atleta_id]||"Atleta") : "Minha mensalidade")}</h3>
      <p><strong>Valor:</strong> ${money(b.valor)}</p>
      <p><strong>Vencimento:</strong> ${dateBR(b.vencimento)}</p>
      <p><strong>Status:</strong> ${esc(b.status==="pago"?"PAGO":"PENDENTE")}</p>
      <p>${esc(b.descricao||"Mensalidade")}</p>
      ${b.pago_em?`<p>Pagamento registrado: ${dateBR(b.pago_em.slice(0,10))}</p>`:""}
      ${forAdmin?`<div class="actions">
        <button data-paid="${b.id}" data-status="${b.status==="pago"?"pendente":"pago"}">${b.status==="pago"?"Voltar para pendente":"Marcar como paga"}</button>
        <button data-delete-bill="${b.id}">Excluir</button>
      </div>`:""}
    </div>`).join("") || "<p>Nenhuma mensalidade cadastrada.</p>";

  $("pageList").querySelectorAll("[data-paid]").forEach(btn=>{
    btn.onclick = async () => {
      const status = btn.dataset.status;
      const {error} = await db.from("mensalidades").update({
        status,
        pago_em:status==="pago"?new Date().toISOString():null
      }).eq("id",btn.dataset.paid);
      if(error) return pageMessage("Erro ao atualizar: "+error.message);
      await showBillList(true);
    };
  });
  $("pageList").querySelectorAll("[data-delete-bill]").forEach(btn=>{
    btn.onclick = async () => {
      if(!confirm("Excluir esta mensalidade?")) return;
      const {error} = await db.from("mensalidades").delete().eq("id",btn.dataset.deleteBill);
      if(error) return pageMessage("Erro ao excluir: "+error.message);
      await showBillList(true);
    };
  });
}

async function loadMyTeam() {
  $("pageList").innerHTML = `
    <div class="item">
      <h3>Minha turma</h3>
      <p>${esc(profile.turma||"Sua turma ainda não foi definida. Aguarde a equipe da Spooky House.")}</p>
      <p>Para alterar sua turma, entre em contato com a administração.</p>
    </div>`;
}

async function loadSimple(table) {
  const {data,error} = await db.from(table).select("*");
  if(error) return pageMessage("Erro ao carregar: "+error.message);
  if(!data?.length) {
    $("pageList").innerHTML = "<p>Nenhum registro cadastrado.</p>";
    return;
  }
  $("pageList").innerHTML = data.map(row => {
    const title = row.titulo || row.nome || "Informação";
    const detail = [
      row.categoria,
      row.dia_semana,
      row.horario_inicio,
      row.horario,
      row.local,
      row.descricao
    ].filter(Boolean).map(esc).join(" • ");
    return `<div class="item"><h3>${esc(title)}</h3><p>${detail}</p></div>`;
  }).join("");
}

db.auth.onAuthStateChange((event,session)=>{
  if(event==="SIGNED_OUT") location.reload();
});
db.auth.getSession().then(({data,error})=>{
  if(error) console.error(error);
  if(data?.session) start(data.session.user);
});
})();
</script>
</body>
</html>
